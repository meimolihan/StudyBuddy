<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一年级语文上册 自测 · 第五单元 识字（二） · 第7课 大小多少</title>
<style>
  :root{
    --bg:#eef2f7; --card:#ffffff; --ink:#1f2937; --muted:#5b6b7b;
    --brand:#1565c0; --brand-soft:#e6f0fb; --ok:#2e7d32; --ok-soft:#e9f6ea;
    --bad:#d32f2f; --bad-soft:#fdecec; --line:#e3e8ef; --warn:#e65100;
    --head1:#1565c0; --head2:#7b1fa2; --btn-sec:#78909c;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1620; --card:#1a2533; --ink:#e6edf3; --muted:#9fb0c0;
      --brand:#4ea1ff; --brand-soft:#16273c; --ok:#5fbf6a; --ok-soft:#15301c;
      --bad:#ff6b6b; --bad-soft:#3a1a1a; --line:#2a3a4a; --warn:#ffa040;
      --head1:#1e3a5f; --head2:#3a1f5f; --btn-sec:#54677a;
    }
  }
  [data-theme="dark"]{
    --bg:#0f1620; --card:#1a2533; --ink:#e6edf3; --muted:#9fb0c0;
    --brand:#4ea1ff; --brand-soft:#16273c; --ok:#5fbf6a; --ok-soft:#15301c;
    --bad:#ff6b6b; --bad-soft:#3a1a1a; --line:#2a3a4a; --warn:#ffa040;
    --head1:#1e3a5f; --head2:#3a1f5f; --btn-sec:#54677a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","微软雅黑",sans-serif;line-height:1.6;
    transition:background .25s ease,color .25s ease;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  .head{background:linear-gradient(135deg,var(--head1),var(--head2));color:#fff;
    border-radius:16px;padding:18px 20px;box-shadow:0 6px 18px rgba(0,0,0,.12);}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .head h1{margin:0;font-size:21px;color:#fff;letter-spacing:.5px;}
  .themebtn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);
    border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;white-space:nowrap;
    transition:.15s ease;}
  .themebtn:hover{background:rgba(255,255,255,.32);}
  .sub{color:rgba(255,255,255,.88);font-size:14px;margin:10px 0 14px;}
  .meta{display:flex;flex-wrap:wrap;gap:10px;font-size:14px;}
  .meta .box{background:rgba(255,255,255,.92);border-radius:8px;padding:6px 12px;color:#0d47a1;}
  .meta .box b{color:#1565c0;}
  .meta #score.done{background:#fff3e0;color:#e65100;}
  .bank{font-size:13px;color:#1f2937;background:rgba(255,255,255,.88);border-radius:8px;
    padding:8px 12px;margin-top:12px;}
  .tip{background:rgba(255,255,255,.92);border-left:4px solid #ffb300;border-radius:8px;
    padding:10px 14px;font-size:13px;color:#5d4037;margin-top:12px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;margin-top:16px;box-shadow:0 1px 6px rgba(0,0,0,.04);transition:.2s;}
  .q.correct{border-color:var(--ok);background:var(--ok-soft);}
  .q.wrong{border-color:var(--bad);background:var(--bad-soft);}
  .qtop{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .badge{font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:2px 8px;}
  .badge.s{background:var(--brand);}
  .badge.m{background:var(--warn);}
  .qno{font-weight:700;}
  .qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .qspk{margin-left:auto;}
  .spk{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
    width:28px;height:28px;border:none;background:var(--brand-soft);color:var(--brand);
    border-radius:50%;cursor:pointer;font-size:14px;line-height:1;transition:.15s;}
  .spk:hover{background:var(--brand);color:#fff;}
  .spk.playing{background:var(--brand);color:#fff;}
  .otext{margin-right:auto;}
  .stem{font-size:16px;margin-bottom:10px;}
  .opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer;
    font-size:15px;background:var(--card);transition:border-color .15s,background .15s,box-shadow .15s;user-select:none;}
  .opt:hover{border-color:var(--brand);background:var(--brand-soft);}
  .opt.sel{border-color:var(--brand);background:var(--brand-soft);font-weight:600;}
  .opt .tick{width:22px;height:22px;border:2px solid #90a4ae;border-radius:6px;
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;}
  .opt.sel .tick{background:var(--brand);border-color:var(--brand);}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft);}
  .opt.ok .tick{background:var(--ok);border-color:var(--ok);}
  .opt.no{border-color:var(--bad);background:var(--bad-soft);}
  .opt.no .tick{background:var(--bad);border-color:var(--bad);}
  .answer{font-size:13px;color:#37474f;margin-top:8px;display:none;}
  .q.done .answer{display:block;}
  .btn{display:block;width:100%;margin:22px 0 0;padding:14px;border:none;border-radius:12px;
    background:var(--brand);color:#fff;font-size:17px;font-weight:700;cursor:pointer;transition:.15s;}
  .btn:hover{background:#0d47a1;}
  .btn.sec{background:#90a4ae;margin-top:10px;}
  .btn.sec:hover{background:#78909c;}
  .result{background:var(--card);border-radius:14px;padding:16px 20px;margin-top:18px;
    border:1px solid var(--line);display:none;text-align:center;}
  .result.show{display:block;}
  .result .big{font-size:40px;font-weight:800;color:var(--brand);}
  .bar{height:10px;border-radius:6px;background:#eeeeee;overflow:hidden;margin:10px 0;}
  .bar > i{display:block;height:100%;background:var(--ok);}
  .foot{color:#9e9e9e;font-size:12px;text-align:center;margin-top:24px;}
</style>

/* ---------- 背景：柔和渐变 + 几何漂浮 + 粒子流光 ---------- */
/* ⚠️ 渐变各色标都以 transparent 收尾，会**透出 body 自身的底色**。
   题库自带 `body{background:var(--bg)}`，而 --bg 只在题库的
   `@media (prefers-color-scheme:dark)` 里被重定义 —— 一旦用户切到亮色、
   系统又是深色（或反之），body 就会露出与主题不符的底色，
   表现为「亮色主题下背景一片深黑」。所以这里必须先铺一层不透明基底。 */
.sbk2-bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  background:
    radial-gradient(1200px 620px at 12% -10%, var(--p-bg-1) 0%, transparent 62%),
    radial-gradient(1000px 560px at 92% 6%, var(--p-bg-2) 0%, transparent 60%),
    radial-gradient(900px 620px at 52% 112%, var(--p-bg-3) 0%, transparent 64%),
    var(--p-base);
}
.sbk2-bg::after{content:""; position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 42%, transparent 38%, rgba(80,95,110,.05) 100%);}
/* 几何图形：低饱和、大尺寸、慢速漂移。blur 制造浅景深 */
.sbk2-sh{position:absolute; border-radius:50%; filter:blur(14px);
  will-change:transform; animation:sbk2-drift 34s var(--p-e-soft) infinite alternate;}
.sbk2-sh.r1{width:210px;height:210px;background:var(--p-shape);
  left:-40px;top:6vh;animation-duration:38s}
.sbk2-sh.r2{width:150px;height:150px;background:var(--p-shape-2);
  right:6vw;top:14vh;border-radius:44% 56% 62% 38%/48% 38% 62% 52%;animation-duration:44s}
.sbk2-sh.r3{width:250px;height:250px;background:var(--p-shape-3);
  right:14vw;bottom:-60px;border-radius:58% 42% 34% 66%/44% 56% 44% 56%;animation-duration:52s}
.sbk2-sh.r4{width:120px;height:120px;background:var(--p-shape);
  left:16vw;bottom:8vh;border-radius:40% 60% 52% 48%/56% 40% 60% 44%;animation-duration:41s}
.sbk2-sh.r5{width:170px;height:170px;background:var(--p-shape-2);
  left:52vw;top:-30px;filter:blur(20px);animation-duration:47s}
@keyframes sbk2-drift{
  0%{transform:translate3d(0,0,0) rotate(0deg) scale(1)}
  50%{transform:translate3d(18px,-26px,0) rotate(14deg) scale(1.06)}
  100%{transform:translate3d(-14px,18px,0) rotate(-10deg) scale(.97)}
}
/* 粒子流光：小点 + 缓慢上浮 + 呼吸式明灭 */
.sbk2-sp{position:absolute; width:4px;height:4px;border-radius:50%;
  background:var(--p-spark); will-change:transform,opacity;
  animation:sbk2-rise linear infinite;}
@keyframes sbk2-rise{
  0%{transform:translate3d(0,0,0) scale(.6); opacity:0}
  12%{opacity:.85}
  78%{opacity:.5}
  100%{transform:translate3d(14px,-118vh,0) scale(1.15); opacity:0}
}

/* ---------- 主体内容浮到背景之上 ---------- */
.sbk2 .wrap{position:relative; z-index:1;}

/* ---------- 顶部标题区：轻 3D 软拟物 ---------- */
.sbk2 .head{
  background:linear-gradient(145deg, var(--p-card) 0%, var(--p-card-2) 100%) !important;
  border:1px solid var(--p-line) !important;
  border-radius:22px !important;
  box-shadow:var(--p-shadow-m) !important;
  padding:22px 24px !important;
  color:var(--p-txt) !important;
  position:relative; overflow:hidden;
  transition:box-shadow var(--p-d) var(--p-e-soft), transform var(--p-d) var(--p-e-out);
}
.sbk2 .head::before{content:""; position:absolute; inset:0 0 auto; height:52%;
  background:linear-gradient(180deg, rgba(255,255,255,.5), transparent);
  pointer-events:none;}
@media (prefers-color-scheme: dark){
  html.sbk2:not([data-theme="light"]) .head::before{background:linear-gradient(180deg, rgba(255,255,255,.045), transparent)}
}
html.sbk2[data-theme="dark"] .head::before{background:linear-gradient(180deg, rgba(255,255,255,.045), transparent)}
.sbk2 .head h1{
  color:var(--p-txt) !important; font-size:23px !important; font-weight:800 !important;
  letter-spacing:.2px; text-shadow:none !important;}
.sbk2 .head .sub{color:var(--p-txt-2) !important; font-size:14.5px !important}

/* 元信息小卡：柔和描边 + 内发光 */
.sbk2 .head .meta .box{
  background:var(--p-card) !important; color:var(--p-txt-2) !important;
  border:1px solid var(--p-line) !important;
  border-radius:12px !important; padding:7px 14px !important;
  box-shadow:var(--p-shadow-s) !important;
}
.sbk2 .head .meta .box b{color:var(--p-txt) !important; font-weight:800}
.sbk2 .head .bank{background:transparent !important; color:var(--p-txt-3) !important;
  border:0 !important; padding:10px 2px 0 !important; font-size:13px !important}
.sbk2 .head .tip{
  background:var(--p-sand-s) !important; color:var(--p-sand-ink) !important;
  border-left:3px solid var(--p-sand) !important;
  border-radius:12px !important; padding:11px 15px !important;
  box-shadow:var(--p-shadow-s) !important; font-size:13.5px !important}

/* ---------- 题目卡片：入场淡入 + 轻微上浮 ---------- */
.sbk2 .q{
  background:linear-gradient(150deg, var(--p-card) 0%, var(--p-card-2) 100%) !important;
  border:1px solid var(--p-line) !important;
  border-radius:20px !important;
  box-shadow:var(--p-shadow-s) !important;
  padding:22px 24px !important; margin-top:18px !important;
  color:var(--p-txt) !important;
  transition:box-shadow var(--p-d) var(--p-e-soft),
             border-color var(--p-d) var(--p-e-soft),
             transform var(--p-d) var(--p-e-out);
  will-change:transform,opacity;
}
.sbk2 .q:hover{box-shadow:var(--p-shadow-m) !important}
/* 入场：淡入 + 上浮 0.25s ease。keyframes 不碰 opacity 的问题——
   本层 opacity 由元素自身承载，动画只动 transform/filter，
   即使动画被系统禁用或时钟卡死，内容也永远可见。 */
.sbk2 .q.sbk2-in{animation:sbk2-qin .25s ease-out backwards}
@keyframes sbk2-qin{
  from{transform:translateY(10px) scale(.994)}
  to{transform:none}
}

/* 题型徽章 */
.sbk2 .badge{
  background:var(--p-blue-s) !important; color:var(--p-blue-ink) !important;
  border-radius:9px !important; padding:3px 11px !important;

  height:26px; background:rgba(120,130,150,.32); transform:translateX(-50%)}

/* 彩虹：同心环彩虹桥。
   ⚠️ 位置不能用 top:8px（会正好落在题目卡片背后，装饰层 z-index:0
   在卡片之下 → 只露出顶部一截彩色弧，看着像渲染 bug）。
   改锚到视口下方空白区，完整可见且不与卡片/气球/动物重叠。
   ⚠️ 也不能用 conic-gradient：它从圆心发散成楔形，出来是一把扇子而不是
   彩虹桥。必须用 radial-gradient 的多段硬色环，才是等宽的同心弧。 */
.sbk-rb{width:190px; height:95px; overflow:hidden; border-radius:190px 190px 0 0;
  background:
    radial-gradient(circle at 50% 100%,
      transparent 0 55px,
      #ff8fb1 55px 60.5px, #ff9f45 60.5px 66px, #ffd23f 66px 71.5px,
      #5ec26a 71.5px 77px, #4aa3ff 77px 82.5px, #a98bff 82.5px 88px,
      transparent 88px);
  opacity:.5}

/* 小动物 / 校园剪影：emoji，蹲在底部不抢视觉 */
.sbk-an{font-size:28px; opacity:.5; animation:sbk-bob 4.2s ease-in-out infinite}

/* 飘浮动画：三个元素用不同周期，避免整齐划一的机械感 */
@keyframes sbk-drift{from{transform:translateX(-14vw)}to{transform:translateX(114vw)}}
@keyframes sbk-drift-r{from{transform:translateX(114vw)}to{transform:translateX(-14vw)}}
@keyframes sbk-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
@keyframes sbk-bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
@keyframes sbk-tw{0%,100%{opacity:.35; transform:scale(.9)}50%{opacity:.85; transform:scale(1.1)}}

/* ---------- 主体内容浮到装饰层之上 ---------- */
.sbk-on .wrap,.sbk-on .hud,.sbk-on .q,.sbk-on .fb,.sbk-on .opts,.sbk-on .stage,
.sbk-on .done,.sbk-on #gameContainer,.sbk-on .gb,.sbk-on [class*="bar"],
.sbk-on [class*="card"],.sbk-on [class*="panel"]{
  position:relative; z-index:1;
}
.sbk-on #gameContainer{max-width:820px; margin:0 auto}

/* ---------- 大卡片：更圆、更软、有厚度感（不用重投影，避免糊） ---------- */
/* ⚠️ 这里**不能**只写 background-color。
   部分页面（grade2 走 .sbk2 Premium 层的那批）自己的 .q 上已经有
   `background:linear-gradient(...)` 简写。若本层用 background-color 覆盖，
   简写里的 image 会**留在上层**、color 被换成 --sbk-card：
   深色下就变成「不透明白底 + 深色渐变被压在下面」→ 卡片渲染成白色，
   而 .stem 的文字色由 .sbk2 定成浅色（--p-txt），于是
   浅字配白底 = 对比度 1.2:1，题干整个看不见。
   （实测 rgb(228,235,242) 配 rgb(255,255,255)。）

   正确做法：同样用 background 简写覆盖，让 image 与 color 一起被接管；
   变量自带 fallback，深色下 --sbk-card 走 --g-card 或落到 #fff，
   与页面自身的明暗保持一致，不引入新的隐形文字故障。 */
.sbk-on .q, .sbk-on #gameContainer, .sbk-on .fb{
  border-radius:24px !important;
  border:2px solid var(--sbk-line) !important;
  box-shadow:0 6px 0 rgba(0,0,0,.05), 0 10px 26px rgba(80,110,160,.13) !important;
  background:var(--sbk-card) !important;
  /* 文字必须与**本层刚设定的背景**同源，否则会出现跨层打架：
     同一批页面里还带 .sbk2（另一个增强层），它把 .stem 定成浅色
     （--p-txt）。本层把卡片背景接管成 --sbk-card 后，若不同步文字色，
     深色下就是浅字配深底/白底，题干直接消失。 */
  color:var(--sbk-ink) !important;
}
/* 题干/题面文字跟随卡片。用 .stem/.q-title/#prompt 这些真实选择器，
   覆盖各页面自己的浅色硬编码（它们 !important，故本层也必须 !important）。 */
.sbk-on .stem, .sbk-on .q-title, .sbk-on #promptText,
.sbk-on .qtext, .sbk-on .question{
  color:var(--sbk-ink) !important;
}

/* ---------- 大字号：题干与选项是低龄阅读的主体，必须够大 ---------- */
.sbk-on .q-title, .sbk-on #promptText{
  font-size:22px !important; line-height:1.65 !important; font-weight:800 !important;
  letter-spacing:.01em;
}
.sbk-on .q-sub, .sbk-on #scoreText, .sbk-on #levelBadge{font-size:15px !important}
.sbk-on .stage{min-height:126px}
.sbk-on .stage .big{font-size:76px}
.sbk-on .stage .py{font-size:40px}
.sbk-on .stage .shape{font-size:64px}
.sbk-on .fb{font-size:17px !important; font-weight:700 !important;
  border-radius:18px !important; padding:12px 16px !important}

/* ⚠️ 不要在这里写 `.opt{opacity:1 !important}` 兜底 ——
   作者 `!important` 声明的优先级**高于 CSS 动画产生的值**，
   会把入场淡入动画（from opacity:0 → to opacity:1）整个废掉。
   可见性兜底已由下方「题目进入动画」处的
   `.sbk-in-opt{opacity:1}` + `fill-mode:backwards` 解决：
   动画被禁 → 无动画 → 元素取自身 opacity:1（可见）；
   动画正常   → 正常淡入。无需 !important。 */

/* ---------- 圆润大按钮 + 五色循环 ---------- */
/* 每个选项给一个色相（nth-child 轮转），孩子靠颜色也能定位选项，
   这对一年级认字不多的学生是很实在的辅助。 */
.sbk-on .opt, .sbk-on .optionsGrid button, .sbk-on .optbtn{
  min-height:62px !important;           /* 触屏热区：远高于 44px 下限 */
  border-radius:20px !important;
  border:3px solid transparent !important;
  font-size:19px !important; font-weight:800 !important;
  box-shadow:0 5px 0 var(--sbk-shadow,rgba(0,0,0,.10)) !important;
  transition:transform .14s cubic-bezier(.34,1.56,.64,1),
             box-shadow .14s, filter .2s !important;
  position:relative; overflow:hidden;
}
.sbk-on .opt:nth-child(5n+1),.sbk-on .optionsGrid button:nth-child(5n+1){
  background-color:var(--sbk-blue-s)!important; border-color:var(--sbk-blue)!important;
  color:var(--sbk-blue-ink)!important;      /* 浅底 → 必须深字，不跟 --g-ink */
  --sbk-shadow:rgba(74,163,255,.34)}
.sbk-on .opt:nth-child(5n+2),.sbk-on .optionsGrid button:nth-child(5n+2){
  background-color:var(--sbk-yellow-s)!important; border-color:var(--sbk-yellow)!important;
  color:var(--sbk-yellow-ink)!important;      /* 浅底 → 必须深字，不跟 --g-ink */
  --sbk-shadow:rgba(255,210,63,.42)}
.sbk-on .opt:nth-child(5n+3),.sbk-on .optionsGrid button:nth-child(5n+3){
  background-color:var(--sbk-green-s)!important; border-color:var(--sbk-green)!important;
  color:var(--sbk-green-ink)!important;      /* 浅底 → 必须深字，不跟 --g-ink */
  --sbk-shadow:rgba(94,194,106,.34)}
.sbk-on .opt:nth-child(5n+4),.sbk-on .optionsGrid button:nth-child(5n+4){
  background-color:var(--sbk-orange-s)!important; border-color:var(--sbk-orange)!important;
  color:var(--sbk-orange-ink)!important;      /* 浅底 → 必须深字，不跟 --g-ink */
  --sbk-shadow:rgba(255,159,69,.36)}
.sbk-on .opt:nth-child(5n+5),.sbk-on .optionsGrid button:nth-child(5n+5){
  background-color:var(--sbk-pink-s)!important; border-color:var(--sbk-pink)!important;
  color:var(--sbk-pink-ink)!important;      /* 浅底 → 必须深字，不跟 --g-ink */
  --sbk-shadow:rgba(255,143,177,.36)}

/* 按下：往下压 + 影子缩短（物理直觉：按下去了） */
.sbk-on .opt.sbk-press, .sbk-on .optionsGrid button.sbk-press{
  transform:translateY(4px) scale(.96) !important;
  box-shadow:0 1px 0 var(--sbk-shadow,rgba(0,0,0,.10)) !important;
  filter:saturate(1.15) brightness(1.03);
}
/* 选项生成的气泡：click 时的扩散圆环 */
.sbk-bubble{
  position:absolute; border-radius:50%; pointer-events:none;
  width:14px; height:14px; margin:-7px 0 0 -7px;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,255,255,.35) 55%,transparent 72%);
  animation:sbk-bub .52s ease-out forwards;
}
@keyframes sbk-bub{from{transform:scale(.4); opacity:.95} to{transform:scale(9); opacity:0}}

/* 正误态：只增强观感，不改类名（类名是判分信号，绝不能动） */
.sbk-on .opt.right, .sbk-on .opt.wrong{animation:none !important}   /* 让下面的 keyframes 接管 */
.sbk-on .opt.right, .sbk-on .opt.ok{
  background-color:var(--sbk-green-s)!important; border-color:var(--sbk-ok)!important;
  color:var(--sbk-ok-ink)!important;      /* 浅底深字，不跟 --g-ok */
}
.sbk-on .opt.wrong, .sbk-on .opt.no{
  background-color:var(--sbk-orange-s)!important; border-color:var(--sbk-bad)!important;
  color:var(--sbk-bad-ink)!important;      /* 浅底深字，不跟 --g-bad */
}
.sbk-on .fb.ok, .sbk-on #feedbackBar.ok{
  background-color:var(--sbk-green-s)!important; border-color:var(--sbk-ok)!important;
  color:var(--sbk-ok-ink)!important}
.sbk-on .fb.no, .sbk-on #feedbackBar.no{
  background-color:var(--sbk-yellow-s)!important; border-color:#e08b00!important;
  color:var(--sbk-warn-ink)!important}
/* 答对：弹跳 + 发光（只作用在正确项上，用 sbk-right 标记，不改原类名） */
.sbk-on .sbk-right{animation:sbk-pop .62s cubic-bezier(.34,1.56,.64,1) 2}
@keyframes sbk-pop{
  0%{transform:scale(1)} 22%{transform:scale(1.13)}
  44%{transform:scale(.97)} 66%{transform:scale(1.05)} 100%{transform:scale(1)}
}
.sbk-on .sbk-right::after{
  content:""; position:absolute; inset:-4px; border-radius:inherit; pointer-events:none;
  box-shadow:0 0 0 3px var(--sbk-ok), 0 0 26px 6px rgba(94,194,106,.55);
  animation:sbk-glow 1.1s ease-in-out 2;
}
@keyframes sbk-glow{0%,100%{opacity:.28}50%{opacity:1}}

/* 答错：温和横向抖动（幅度小、次数少，不吓到孩子） */
.sbk-on .sbk-wrong{animation:sbk-shake .5s cubic-bezier(.36,.07,.19,.97) 1}
@keyframes sbk-shake{
  0%,100%{transform:translateX(0)}
  18%{transform:translateX(-6px)} 38%{transform:translateX(6px)}
  58%{transform:translateX(-4px)} 78%{transform:translateX(3px)}
}

/* ---------- 题目进入动画：从下方弹上来 ----------
   ⚠️⚠️⚠️ 入场动画**绝对不要碰 opacity**（一次教训换来的）。
   原因：CSS 动画关键帧产生的值，优先级**高于**元素的普通 `opacity:1` 声明。
   所以只要 keyframes 里写了 `from{opacity:0}`，那个 0 就会赢过普通声明；
   而 `fill-mode:both/backwards` 在延迟期/结束后又会保持该帧的值 ——
   动画一旦没真正执行（引擎的 `@media (prefers-reduced-motion:reduce)`
   里 `*{animation:none!important}`、标签页被节流、动画时钟卡死），
   **整道题选项文字就永久消失**。一年级看不见选项 = 无法答题，是致命故障。

   第 1 版曾用「`opacity:1` 普通声明 + `fill-mode:backwards`」想兜底 ——
   **无效**，实测 31/33 个文件仍是 opacity:0（普通声明压不过关键帧）。

   现在改为**纯 transform 入场**：关键帧里只出现 transform（位移+缩放），
   opacity 完全不参与。这样无论动画跑不跑、跑多少帧，
   文字可见性都不受任何影响 —— 动画只是"位置观感增强"，而不是"可见性前提"。 */
.sbk-in{animation:sbk-in .52s cubic-bezier(.34,1.4,.64,1) backwards}
@keyframes sbk-in{
  from{transform:translateY(26px) scale(.94)}
  to{transform:none}
}
.sbk-in-opt{animation:sbk-in-opt .44s cubic-bezier(.34,1.5,.64,1) backwards}
@keyframes sbk-in-opt{
  from{transform:translateY(14px) scale(.92)}
  to{transform:none}
}

/* ---------- 答对奖励：星星 + 彩带 + 笑脸 + 点赞 ---------- */
.sbk-fx{position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden}
.sbk-star{position:absolute; font-size:30px; line-height:1;
  animation:sbk-star .95s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes sbk-star{
  0%{opacity:0; transform:translate(0,0) scale(.3) rotate(0)}
  18%{opacity:1; transform:translate(0,-16px) scale(1.25) rotate(18deg)}
  100%{opacity:0; transform:translate(var(--dx,40px),var(--dy,-150px)) scale(.55) rotate(220deg)}
}
.sbk-ribbon{position:absolute; width:11px; height:20px; border-radius:3px;
  animation:sbk-rib 1.05s ease-in forwards}
@keyframes sbk-rib{
  0%{opacity:0; transform:translate(0,0) rotate(0)}
  12%{opacity:1}
  100%{opacity:0; transform:translate(var(--dx,0),var(--dy,300px)) rotate(var(--rot,540deg))}
}
.sbk-cheer{position:fixed; left:50%; top:38%; z-index:61; pointer-events:none;
  transform:translate(-50%,-50%);
  animation:sbk-cheer 1.15s cubic-bezier(.34,1.5,.64,1) forwards}
.sbk-cheer .sbk-face{font-size:78px; line-height:1; animation:sbk-nod 1.15s ease-in-out}
.sbk-cheer .sbk-word{margin-top:4px; font-size:22px; font-weight:900; color:var(--sbk-ok-ink);
  text-shadow:0 2px 0 #fff, 0 0 16px rgba(94,194,106,.5); text-align:center}
@keyframes sbk-cheer{
  0%{opacity:0; transform:translate(-50%,-50%) scale(.3) rotate(-16deg)}
  30%{opacity:1; transform:translate(-50%,-50%) scale(1.1) rotate(6deg)}
  45%{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
  100%{opacity:0; transform:translate(-50%,-62%) scale(.96)}
}
@keyframes sbk-nod{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg) scale(1.06)}
  60%{transform:rotate(7deg) scale(1.03)}}
/* 答错：温和的提示气泡（从选项旁冒出来，不遮挡题目） */
.sbk-hint{position:fixed; z-index:61; pointer-events:none; transform:translate(-50%,-100%);
  background:var(--sbk-yellow-s); color:var(--sbk-warn-ink);
  border:2px solid var(--sbk-yellow); border-radius:16px;
  padding:8px 14px; font-size:16px; font-weight:800; white-space:nowrap;
  box-shadow:0 5px 0 rgba(0,0,0,.07);
  animation:sbk-hint 1.5s cubic-bezier(.34,1.4,.64,1) forwards}
@keyframes sbk-hint{
  0%{opacity:0; transform:translate(-50%,-84%) scale(.6)}
  16%{opacity:1; transform:translate(-50%,-100%) scale(1.06)}
  26%{transform:translate(-50%,-100%) scale(1)}
  80%{opacity:1; transform:translate(-50%,-100%) scale(1)}
  100%{opacity:0; transform:translate(-50%,-128%) scale(.9)}
}

/* ---------- 音效与音乐开关 ---------- */
.sbk-bar{position:fixed; right:10px; bottom:10px; z-index:70;
  display:flex; gap:8px; align-items:center}
.sbk-ico{
  width:52px; height:52px; border-radius:50%; border:2px solid var(--sbk-line);
  background:var(--sbk-card); color:var(--sbk-ink); cursor:pointer;
  font-size:23px; line-height:1; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 0 rgba(0,0,0,.08); padding:0;
  transition:transform .14s cubic-bezier(.34,1.56,.64,1);
}
.sbk-ico:active{transform:translateY(3px) scale(.94)}
.sbk-ico:focus-visible{outline:3px solid var(--sbk-blue); outline-offset:2px}
.sbk-ico[aria-pressed="true"]{background:var(--sbk-blue-s); border-color:var(--sbk-blue)}
.sbk-ico.sbk-sound{position:relative}
.sbk-ico.sbk-off{opacity:.5; filter:grayscale(1)}

/* ---------- 结算页也放大 ---------- */
.sbk-on .done h2{font-size:30px !important}
.sbk-on .done .medal{font-size:84px !important;
  animation:sbk-bob 2.6s ease-in-out infinite; display:inline-block}
.sbk-on .btn, .sbk-on .resetBtn, .sbk-on #resetBtn{
  min-height:58px !important; border-radius:999px !important; font-size:20px !important;
  font-weight:900 !important; padding:14px 40px !important;
  background:var(--sbk-brand) !important; color:#fff !important;
  box-shadow:0 5px 0 rgba(0,0,0,.14) !important;
  transition:transform .14s cubic-bezier(.34,1.56,.64,1) !important;
}
.sbk-on .btn:active,.sbk-on #resetBtn:active{transform:translateY(4px) scale(.97) !important}

/* ---------- 三端适配：平板 / 手机 ---------- */
@media (max-width:760px){
  .sbk-on .q-title,.sbk-on #promptText{font-size:20px !important}
  .sbk-on .opt,.sbk-on .optionsGrid button{font-size:18px !important; min-height:60px !important}
  .sbk-on .stage .big{font-size:64px}
  .sbk-deco{opacity:.75}                 /* 小屏少一点装饰，避免抢注意力 */
}
@media (max-width:420px){
  .sbk-on .q-title,.sbk-on #promptText{font-size:19px !important}
  .sbk-on .opt,.sbk-on .optionsGrid button{
    min-height:60px !important; font-size:17px !important; border-radius:18px !important}
  .sbk-on .stage .big{font-size:54px}
  .sbk-on .stage .py{font-size:32px}
  .sbk-ico{width:48px; height:48px; font-size:21px}
  .sbk-bar{right:8px; bottom:8px}
}
/* 触屏：hover 会「粘住」，用 hover:hover 门控 */
@media (hover:none){
  .sbk-on .opt:active,.sbk-on .optionsGrid button:active{
    transform:translateY(4px) scale(.96) !important}
}
/* 无障碍：用户开了「减少动态效果」就全部关掉（游戏本体已有同类兜底） */
@media (prefers-reduced-motion:reduce){
  .sbk-deco{display:none !important}
  .sbk-in,.sbk-in-opt,.sbk-right,.sbk-wrong,.sbk-star,.sbk-ribbon,
  .sbk-cheer,.sbk-hint,.sbk-ba,.sbk-an,.sbk-st{animation:none !important}
  .sbk-in,.sbk-in-opt{opacity:1 !important; transform:none !important}
  /* 上面那条 opacity:1 现在只是双保险（keyframes 已不碰 opacity），
     真正让内容永不可见的原因已被「入场动画不碰 opacity」从根上除掉。 */
}
@media print{ .sbk-deco,.sbk-bar{display:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="topbar">
      <h1>一年级语文上册 · 自测卷（人教版）</h1>
      <button class="themebtn" id="themeBtn" onclick="toggleTheme()" title="切换主题：跟随系统 / 明亮 / 暗黑">🔄 跟随系统</button>
    </div>
    <div class="sub">第五单元 识字（二） · 第7课 大小多少</div>
    <div class="meta">
      <div class="box">姓名：<b>郭奕凡</b></div>
      <div class="box">日期：<b id="date">—</b></div>
      <div class="box" id="score">得分：<b>待评定</b></div>
    </div>
    <div class="bank">📚 题库共 <b>20</b> 题，每次最多抽取 <b>10</b> 题 · <span id="batch">第 1 批</span></div>
    <div class="tip" id="broadcast">📣 今日广播：一个大，一个小，一头黄牛一只猫；一边多，一边少，一群鸭子一只鸟。量词用对，说话才好听。</div>
  </div>

  <div id="quiz"></div>

  <button class="btn" id="submit" onclick="grade()">✅ 提交自测（自动判分）</button>
  <button class="btn sec" id="reset" onclick="resetAll()" style="display:none;">🔄 重做一遍（同一批）</button>
  <button class="btn sec" id="continue" onclick="continueTest()" style="display:none;">➡️ 继续测试（换一批新题）</button>

  <div class="result" id="result">
    <div>本次自测得分</div>
    <div class="big" id="scoreBig">0</div>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
    <div id="resultText"></div>
  </div>

  <div class="foot">人教版一年级语文上册 · 每题 10 分，满分 = 本批题数 × 10</div>
</div>

<script>
const ALL = [ {t:"s",q:"「一个大，一个小」，课文里大的动物是（　）。",o:["鸭子", "猫", "黄牛", "鸟"],a:["C"],e:"解析：本题正确答案为 C：黄牛。"},
 {t:"s",q:"「一个大，一个小」，课文里小的动物是（　）。",o:["鸟", "猫", "黄牛", "鸭子"],a:["B"],e:"解析：本题正确答案为 B：猫。"},
 {t:"s",q:"「一边多，一边少」，多的是（　）。",o:["一颗枣", "一只鸟", "一个苹果", "一群鸭子"],a:["D"],e:"解析：本题正确答案为 D：一群鸭子。"},
 {t:"s",q:"「一堆杏子一个桃」，多的是（　）。",o:["枣", "桃", "苹果", "杏子"],a:["D"],e:"解析：本题正确答案为 D：杏子。"},
 {t:"s",q:"一（　）黄牛。",o:["条", "个", "头", "只"],a:["C"],e:"解析：本题正确答案为 C：头。"},
 {t:"s",q:"一（　）猫。",o:["头", "个", "只", "条"],a:["C"],e:"解析：本题正确答案为 C：只。"},
 {t:"s",q:"一（　）鸭子。",o:["条", "头", "张", "群"],a:["D"],e:"解析：本题正确答案为 D：群。"},
 {t:"s",q:"一（　）枣。",o:["颗", "头", "只", "个"],a:["A"],e:"解析：本题正确答案为 A：颗。"},
 {t:"s",q:"一（　）桃。",o:["只", "个", "群", "颗"],a:["B"],e:"解析：本题正确答案为 B：个。"},
 {t:"s",q:"一（　）鸟。",o:["群", "头", "颗", "只"],a:["D"],e:"解析：本题正确答案为 D：只。"},
 {t:"s",q:"「大」的反义词是（　）。",o:["小", "少", "多", "长"],a:["A"],e:"解析：本题正确答案为 A：小。"},
 {t:"s",q:"「多」的反义词是（　）。",o:["少", "大", "无", "小"],a:["A"],e:"解析：本题正确答案为 A：少。"},
 {t:"s",q:"「黄牛」的「黄」，读音是（　）。",o:["huáng", "fáng", "huán", "wáng"],a:["A"],e:"解析：本题正确答案为 A：huáng。"},
 {t:"s",q:"「鸭」的声母是（　）。",o:["y", "j", "x", "q"],a:["A"],e:"解析：本题正确答案为 A：y。"},
 {t:"s",q:"「杏」的读音是（　）。",o:["xín", "xìng", "sìng", "xìn"],a:["B"],e:"解析：「杏」的正确读音是 xìng。"},
 {t:"m",q:"下面量词用得正确的有（　）。",o:["一只鸟", "一群鸭子", "一条鸟", "一头牛"],a:["A", "B", "D"],e:"解析：本题正确答案为 A、B、D：一只鸟；一群鸭子；一头牛。"},
 {t:"s",q:"「苹果」是一种（　）。",o:["水果", "文具", "动物", "蔬菜"],a:["A"],e:"解析：本题正确答案为 A：水果。"},
 {t:"s",q:"下面属于动物的是（　）。",o:["桃", "猫", "杏子", "苹果"],a:["B"],e:"解析：本题正确答案为 B：猫。"},
 {t:"m",q:"下面属于水果的有（　）。",o:["苹果", "黄牛", "桃", "枣"],a:["A", "C", "D"],e:"解析：本题正确答案为 A、C、D：苹果；桃；枣。"},
 {t:"s",q:"「边」的读音是（　）。",o:["biā", "piān", "biàn", "biān"],a:["D"],e:"解析：「边」的正确读音是 biān。"}];
const PER_ROUND = 10;
const quiz = document.getElementById("quiz");
let Q = [];
let seen = new Set();
let batch = 0;

const THEMES = ["auto", "light", "dark"];
const THEME_ICON = { auto: "🔄 跟随系统", light: "☀️ 明亮模式", dark: "🌙 暗黑模式" };
function applyTheme(t){
  if(t === "dark") document.documentElement.setAttribute("data-theme", "dark");
  else if(t === "light") document.documentElement.setAttribute("data-theme", "light");
  else document.documentElement.removeAttribute("data-theme");
}
function updateThemeBtn(){
  const t = localStorage.getItem("sci_theme") || "auto";
  const btn = document.getElementById("themeBtn");
  if(btn) btn.textContent = THEME_ICON[t];
}
function toggleTheme(){
  const cur = localStorage.getItem("sci_theme") || "auto";
  const next = THEMES[(THEMES.indexOf(cur) + 1) % 3];
  localStorage.setItem("sci_theme", next);
  applyTheme(next);
  updateThemeBtn();
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pickRound(){
  // 优先抽取从未做过的题；整库做完后才重新洗牌，保证“续测不重复刷完”
  let pool = ALL.map((_,i)=>i).filter(i=>!seen.has(i));
  if(pool.length === 0){ seen = new Set(); pool = ALL.map((_,i)=>i); }
  shuffle(pool);
  const n = Math.min(PER_ROUND, pool.length);
  const chosen = pool.slice(0, n);
  chosen.forEach(i=>seen.add(i));
  return chosen.map(i=>{ const o=Object.assign({},ALL[i]); o.pick=[]; return o; });
}
function speak(text, btn){
  if(!('speechSynthesis' in window)){
    alert('当前浏览器不支持朗读，请用 Chrome 或 Edge 打开。'); return;
  }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  document.querySelectorAll('.spk.playing').forEach(function(b){b.classList.remove('playing');});
  const u=new SpeechSynthesisUtterance(String(text));
  u.lang='zh-CN'; u.rate=0.9; u.pitch=1;
  if(btn){
    btn.classList.add('playing');
    u.onend=function(){ btn.classList.remove('playing'); };
    u.onerror=function(){ btn.classList.remove('playing'); };
  }
  window.speechSynthesis.speak(u);
}
function render(){
  quiz.innerHTML="";
  Q.forEach((item,i)=>{
    const wrap=document.createElement("div");
    wrap.className="q"; wrap.id="q"+i;
    const qtop=document.createElement("div"); qtop.className="qtop";
    const badge=document.createElement("span");
    badge.className="badge "+(item.t==="s"?"s":"m");
    badge.textContent=item.t==="s"?"单选题":"多选题";
    const qno=document.createElement("span"); qno.className="qno"; qno.textContent="第 "+(i+1)+" 题";
    const qspk=document.createElement("button"); qspk.className="spk qspk"; qspk.type="button";
    qspk.title="读题（朗读题目与选项）"; qspk.textContent="🔊";
    const full=item.q+"。"+item.o.map((o,j)=>"ABCD"[j]+"："+o).join("，")+"。"
      +(item.t==="s"?"这是单选题，请选一个答案。":"这是多选题，可以选多个答案。");
    qspk.addEventListener("click",function(){ speak(full, qspk); });
    qtop.appendChild(badge); qtop.appendChild(qno); qtop.appendChild(qspk);
    const stem=document.createElement("div"); stem.className="stem"; stem.textContent=item.q;
    wrap.appendChild(qtop); wrap.appendChild(stem);
    item.o.forEach(function(o,j){
      const opt=document.createElement("div"); opt.className="opt"; opt.id="o"+i+"_"+j;
      opt.addEventListener("click",function(){ pick(i,j); });
      const tick=document.createElement("span"); tick.className="tick"; tick.id="tk"+i+"_"+j; tick.textContent="○";
      const otext=document.createElement("span"); otext.className="otext"; otext.textContent="ABCD"[j]+". "+o;
      const spk=document.createElement("button"); spk.className="spk"; spk.type="button";
      spk.title="读出来"; spk.textContent="🔊";
      spk.addEventListener("click",function(e){ e.stopPropagation(); speak(o, spk); });
      opt.appendChild(tick); opt.appendChild(otext); opt.appendChild(spk);
      wrap.appendChild(opt);
    });
    const ans=document.createElement("div"); ans.className="answer"; ans.id="ans"+i;
    wrap.appendChild(ans);
    quiz.appendChild(wrap);
  });
  document.getElementById("batch").textContent = "第 "+batch+" 批";
}
function newRound(){
  if(window.speechSynthesis){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  batch++;
  Q = pickRound();
  render();
  const sc=document.getElementById("score");
  sc.innerHTML='得分：<b>待评定</b>'; sc.classList.remove("done");
  document.getElementById("result").classList.remove("show");
  document.getElementById("reset").style.display="none";
  document.getElementById("continue").style.display="none";
  const sb=document.getElementById("submit"); sb.textContent="✅ 提交自测（自动判分）"; sb.disabled=false;
  window.scrollTo({top:0,behavior:"smooth"});
}
function pick(i,j){
  const item=Q[i];
  const el=document.getElementById("o"+i+"_"+j);
  if(item.t==="s"){
    for(let k=0;k<item.o.length;k++){
      document.getElementById("o"+i+"_"+k).classList.remove("sel");
      document.getElementById("tk"+i+"_"+k).textContent="○";
    }
    el.classList.add("sel"); document.getElementById("tk"+i+"_"+j).textContent="✔";
    item.pick=["ABCD"[j]];
  }else{
    if(el.classList.contains("sel")){
      el.classList.remove("sel"); document.getElementById("tk"+i+"_"+j).textContent="○";
      item.pick=(item.pick||[]).filter(x=>x!=="ABCD"[j]);
    }else{
      el.classList.add("sel"); document.getElementById("tk"+i+"_"+j).textContent="✔";
      item.pick=item.pick||[]; if(!item.pick.includes("ABCD"[j])) item.pick.push("ABCD"[j]);
    }
  }
}
function grade(){
  let score=0; let answered=0;
  Q.forEach((item,i)=>{
    const sel=(item.pick||[]).slice().sort();
    const ans=item.a.slice().sort();
    const right = sel.length===ans.length && sel.every((v,k)=>v===ans[k]);
    const box=document.getElementById("q"+i);
    box.classList.add("done");
    if(sel.length>0) answered++;
    if(right){ score+=10; box.classList.add("correct"); }
    else{
      box.classList.add("wrong");
      item.a.forEach(L=>{const idx="ABCD".indexOf(L);document.getElementById("o"+i+"_"+idx).classList.add("ok");
        document.getElementById("tk"+i+"_"+idx).textContent="✔";});
      (item.pick||[]).forEach(L=>{if(!item.a.includes(L)){const idx="ABCD".indexOf(L);
        document.getElementById("o"+i+"_"+idx).classList.add("no");
        document.getElementById("tk"+i+"_"+idx).textContent="✘";}});
    }
    document.getElementById("ans"+i).innerHTML =
      "<b>正确答案："+item.a.join("、")+"</b>" + (right?" ✓ 你答对啦！":"（本题你未答对）");
  });
  const maxScore = Q.length * 10;
  const sc=document.getElementById("score");
  sc.innerHTML='得分：<b>'+score+'</b> / '+maxScore; sc.classList.add("done");
  document.getElementById("scoreBig").textContent=score;
  document.getElementById("barFill").style.width=(maxScore?score/maxScore*100:0)+"%";
  const msg = score>=80 ? "🎉 通过！可推进到下一节。"
            : score>=60 ? "⚠️ 部分掌握，建议再巩固一下。"
            : "❌ 未通过，需重新学习本节。";
  document.getElementById("resultText").innerHTML =
    (answered<Q.length?"（注意：有 "+(Q.length-answered)+" 题未作答）<br>":"")+msg;
  document.getElementById("result").classList.add("show");
  document.getElementById("reset").style.display="block";
  document.getElementById("continue").style.display="block";
  document.getElementById("submit").textContent="已提交 ✔";
  document.getElementById("submit").disabled=true;
  window.scrollTo({top:document.getElementById("result").offsetTop-20,behavior:"smooth"});
}
function resetAll(){
  if(window.speechSynthesis){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  Q.forEach(it=>it.pick=[]);
  document.querySelectorAll(".opt").forEach(o=>{o.classList.remove("sel","ok","no");
    o.querySelector(".tick").textContent="○";});
  document.querySelectorAll(".q").forEach(q=>q.classList.remove("done","correct","wrong"));
  document.querySelectorAll(".answer").forEach(a=>a.innerHTML="");
  const sc=document.getElementById("score");sc.innerHTML='得分：<b>待评定</b>';sc.classList.remove("done");
  document.getElementById("result").classList.remove("show");
  document.getElementById("reset").style.display="none";
  document.getElementById("continue").style.display="none";
  const sb=document.getElementById("submit");sb.textContent="✅ 提交自测（自动判分）";sb.disabled=false;
  window.scrollTo({top:0,behavior:"smooth"});
}
function continueTest(){ newRound(); }
(function(){
  const d=new Date();
  const pad=n=>String(n).padStart(2,"0");
  document.getElementById("date").textContent=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  applyTheme(localStorage.getItem("sci_theme") || "auto");
  updateThemeBtn();
  newRound();
})();
</script>
<script id="__SBK2_JS__">
(function(){
  "use strict";
  var doc = document;
  var root = doc.documentElement;

  /* ---------- 动效强度与音频偏好 ---------- */
  var reduced = false;
  try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){}
  var lowPower = false;
  try { lowPower = (navigator.hardwareConcurrency || 8) <= 4; } catch(e){}

  var P_SFX = "sbk2_sound";
  var P_BGM = "sbk2_bgm";
  var P_VOL = "sbk2_vol";
  function readLS(k, d){ try { var v = localStorage.getItem(k); return (v === null || v === "") ? d : v; } catch(e){ return d; } }
  function writeLS(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  /* ==========================================================
     1. 音频：高保真合成音色
     ----------------------------------------------------------
     浏览器自动播放策略：用户产生真实手势（pointerdown/click/keydown）
     之前**绝对不能 new AudioContext()**，否则控制台会按每个音一条
     刷 "The AudioContext was not allowed to start" 警告，声音也不响。
     所以用 unlocked 闸门：未解锁时 audio() 直接返回 null，
     所有发声自然空转且不报错。
     ========================================================== */
  var AC = window.AudioContext || window.webkitAudioContext;
  var ac = null, master = null, comp = null;
  var unlocked = false;
  var sfxOn = readLS(P_SFX, "1") === "1";
  var bgmOn = readLS(P_BGM, "0") === "1";
  var vol = (function(){ var v = parseFloat(readLS(P_VOL, "0.5")); return (isNaN(v) ? 0.5 : Math.max(0, Math.min(1, v))); })();

  function audio(){
    if (!AC || !unlocked) { return null; }
    if (!ac) {
      try {
        ac = new AC();
        comp = ac.createDynamicsCompressor();
        /* 温和压缩：避免多音叠加时刺耳，同时保留奖励音的通透感 */
        comp.threshold.value = -18; comp.knee.value = 22;
        comp.ratio.value = 4; comp.attack.value = .004; comp.release.value = .18;
        master = ac.createGain();
        master.gain.value = vol;
        master.connect(comp); comp.connect(ac.destination);
      } catch(e){ ac = null; }
    }
    if (ac && ac.state === "suspended") { try { ac.resume(); } catch(e){} }
    return ac;
  }
  function unlockAudio(){
    if (unlocked) { return; }
    unlocked = true;
    var a = audio();
    if (a) { try { a.resume(); } catch(e){} }
    if (bgmOn) { bgmStart(); }
  }

  /* --- 音色库：全部为正弦/三角波 + 指数包络，干净无噪 --- */
  function env(g, t, a, d, peak){
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(o){
    var a = audio(); if (!a || !sfxOn) { return; }
    var t = o.at || a.currentTime + 0.005;
    var osc = a.createOscillator(), g = a.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) { osc.frequency.exponentialRampToValueAtTime(o.f2, t + (o.slide || .12)); }
    env(g, t, o.a || .008, o.d || .18, o.p == null ? .3 : o.p);
    var node = osc;
    if (o.filt) {
      var lp = a.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = o.filt; lp.Q.value = .7;
      osc.connect(lp); node = lp;
    }
    node.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + (o.a || .008) + (o.d || .18) + .04);
  }
  var SFX = {
    /* 点击：轻脆短促的高音，2 个泛音微叠加 → 干净不刺耳 */
    click: function(){
      tone({f:1180, f2:1560, type:"sine", a:.004, d:.07, p:.20, filt:5200});
      tone({f:2360, type:"sine", a:.003, d:.045, p:.055, filt:6400});
    },
    /* 答对：明亮通透的三音上行奖励音（纯律叠置，泛音自然） */
    good: function(){
      var a = audio(); if (!a || !sfxOn) { return; }
      var t0 = a.currentTime + 0.005;
      tone({at:t0,         f:659.25, type:"sine", a:.01, d:.30, p:.24});  /* E5 */
      tone({at:t0+.075,    f:830.61, type:"sine", a:.01, d:.30, p:.21});  /* G#5 */
      tone({at:t0+.150,    f:987.77, type:"sine", a:.01, d:.52, p:.19});  /* B5 */
      tone({at:t0+.150,    f:1318.5, type:"sine", a:.012, d:.46, p:.075}); /* E6 泛音 */
    },
    /* 答错：低沉温和的两音下行，圆润无冲击 */
    bad: function(){
      var a = audio(); if (!a || !sfxOn) { return; }
      var t0 = a.currentTime + 0.005;
      tone({at:t0,      f:392.00, f2:349.23, type:"sine", a:.02, d:.20, p:.19, slide:.14});
      tone({at:t0+.10,  f:293.66, f2:261.63, type:"sine", a:.02, d:.26, p:.13, slide:.16, filt:1200});
    },
    /* 切题：极轻的气流感，引导注意但不打扰 */
    turn: function(){ tone({f:880, f2:1046.5, type:"sine", a:.006, d:.10, p:.10, filt:4800}); }
  };
  function play(k){ try { if (SFX[k]) { SFX[k](); } } catch(e){} }

  /* --- BGM：轻柔环境音（正弦琶音 + 慢速包络），非循环采样文件 --- */
  var bgmTimer = null, bgmStep = 0;
  var BGM_CHORD = [
    [261.63, 329.63, 392.00],   /* C 大调 */
    [220.00, 261.63, 329.63],   /* Am */
    [174.61, 220.00, 261.63],   /* F */
    [196.00, 246.94, 293.66]    /* G */
  ];
  function bgmTick(){
    var a = audio(); if (!a || !bgmOn) { return; }
    var ch = BGM_CHORD[bgmStep % BGM_CHORD.length];
    var t = a.currentTime + 0.02;
    for (var i = 0; i < ch.length; i++) {
      var osc = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
      osc.type = "sine";
      osc.frequency.value = ch[i] * (i === 2 ? 2 : 1);   /* 高八度更清透 */
      lp.type = "lowpass"; lp.frequency.value = 1500; lp.Q.value = .4;
      /* 极缓的起落 + 低音量 = 环境音而非背景音乐 */
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.032, t + .8);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
      osc.connect(lp); lp.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + 2.8);
    }
    bgmStep++;
  }
  function bgmStart(){
    if (bgmTimer) { return; }
    if (!unlocked) { return; }   /* 闸门未开不排程，免占定时器 */
    bgmTick();
    bgmTimer = setInterval(bgmTick, 2600);
  }
  function bgmStop(){ if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } }

  /* ==========================================================
     2. 背景：几何漂浮 + 粒子流光
     ----------------------------------------------------------
     性能：粒子数量按设备能力自适应（低端机减半）；
     全部用 transform/opacity，**不触发重排**；低端机直接不生成粒子。
     ========================================================== */
  function buildBackdrop(){
    if (reduced) { return; }
    var bg = doc.createElement("div");
    bg.className = "sbk2-bg";
    var shapes = ["r1","r2","r3","r4","r5"];
    for (var i = 0; i < shapes.length; i++) {
      var s = doc.createElement("span");
      s.className = "sbk2-sh " + shapes[i];
      bg.appendChild(s);
    }
    doc.body.appendChild(bg);

    var n = lowPower ? 8 : 18;
    for (var j = 0; j < n; j++) {
      var p = doc.createElement("span");
      p.className = "sbk2-sp";
      p.style.left = (Math.random() * 100).toFixed(2) + "%";
      p.style.bottom = (-Math.random() * 30).toFixed(2) + "%";
      var size = 2 + Math.random() * 3.2;
      p.style.width = size.toFixed(1) + "px";
      p.style.height = size.toFixed(1) + "px";
      p.style.animationDuration = (22 + Math.random() * 26).toFixed(1) + "s";
      p.style.animationDelay = (-Math.random() * 30).toFixed(1) + "s";
      bg.appendChild(p);
    }
  }

  /* ==========================================================
     3. 星芒粒子：答对时 0.8s 迸发并自动移除
     ========================================================== */
  function burst(el){
    if (!el || reduced || lowPower) { return; }
    var r = el.getBoundingClientRect();
    if (!r.width) { return; }
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var host = doc.body;
    /* 光晕 */
    var halo = doc.createElement("span");
    halo.className = "sbk2-halo";
    halo.style.left = cx + "px"; halo.style.top = cy + "px";
    host.appendChild(halo);
    /* 8 颗星芒，扇形略向上展开 */
    var count = 8;
    for (var i = 0; i < count; i++) {
      var s = doc.createElement("span");
      s.className = "sbk2-spark";
      var ang = (-Math.PI * .86) + (i / (count - 1)) * Math.PI * .72;
      var dist = 26 + Math.random() * 30;
      s.style.left = cx + "px"; s.style.top = cy + "px";
      s.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(1) + "px");
      s.style.setProperty("--dy", (Math.sin(ang) * dist).toFixed(1) + "px");
      s.style.animationDelay = (Math.random() * .09).toFixed(3) + "s";
      host.appendChild(s);
      (function(node){ setTimeout(function(){ if (node.parentNode) { node.parentNode.removeChild(node); } }, 1100); })(s);
    }
    setTimeout(function(){ if (halo.parentNode) { halo.parentNode.removeChild(halo); } }, 1000);
  }

  /* ==========================================================
     4. 入场编排：题目卡片淡入 + 轻微上浮
     ----------------------------------------------------------
     ⚠️ keyframes 只动 transform，不碰 opacity —— 保证无论动画是否
     执行，内容可见性都不受影响（见 MEMORY.md 的教训记录）。
     ========================================================== */
  function qIn(node, delay){
    if (!node || reduced) { return; }
    node.classList.remove("sbk2-in");
    void node.offsetWidth;              /* 强制 reflow 以便重放 */
    node.style.animationDelay = (delay || 0) + "s";
    node.classList.add("sbk2-in");
    /* ⚠️⚠️ 必须 animationend 后摘掉 class。`fill-mode:backwards` 会让动画
       在结束后**依然驻留在 getAnimations() 里**（playState 仍为 running/finished
       但对象不回收）。无头实测：20 道题各挂 3 个常驻动画 = 60 个永不释放，
       全文页 536 个动画对象。低性能设备上这是实打实的内存与合成开销。
       入场动画是一次性的，播完就该彻底释放。 */
    var cleaned = false;
    function cleanup(){
      if (cleaned) { return; }
      cleaned = true;
      node.classList.remove("sbk2-in");
      node.style.animationDelay = "";
    }
    node.addEventListener("animationend", cleanup, {once:true});
    /* 保险丝：动画时钟若未推进（标签页节流等），2s 后摘掉 class 回自然位 */
    setTimeout(function(){
      var list = node.getAnimations ? node.getAnimations() : [];
      for (var i = 0; i < list.length; i++) {
        if ((list[i].currentTime || 0) > 0) { return; }
      }
      cleanup();
    }, 2000);
  }
  function runIn(){
    var qs = doc.querySelectorAll(".q");
    for (var i = 0; i < qs.length; i++) {
      qIn(qs[i], Math.min(i * 0.045, 0.5));
    }
  }

  /* ==========================================================
     5. 判分结果观察：只看 class，绝不改判分逻辑
     ----------------------------------------------------------
     引擎 grade() 会给 .q 加 correct/wrong，给 .opt 加 ok/no。
     我们据此触发动效与音效，**不参与判定**。
     ========================================================== */
  var seenState = new WeakSet();
  function handleQ(q){
    if (!q || seenState.has(q)) { return; }
    var ok = q.classList.contains("correct");
    var no = q.classList.contains("wrong");
    if (!ok && !no) { return; }
    seenState.add(q);
    if (ok) {
      play("good");
      var opts = q.querySelectorAll(".opt.ok");
      for (var i = 0; i < opts.length; i++) { burst(opts[i]); }
    } else {
      play("bad");
    }
  }
  function watch(){
    if (window.MutationObserver && doc.body) {
      var mo = new MutationObserver(function(){
        var qs = doc.querySelectorAll(".q.correct, .q.wrong");
        for (var i = 0; i < qs.length; i++) { handleQ(qs[i]); }
      });
      mo.observe(doc.body, {subtree:true, childList:true, attributes:true, attributeFilter:["class"]});
    }
  }

  /* ==========================================================
     6. 交互：悬浮 / 按下
     ----------------------------------------------------------
     捕获阶段监听，**只加 class 与播音效，绝不 preventDefault /
     stopPropagation**，引擎的答题逻辑完全不受影响。
     ⚠️ 必须在本监听开头就 unlockAudio()：本监听是捕获阶段，
     比挂在冒泡阶段的解锁先跑，不在这里解锁则首次点击无声。
     ========================================================== */
  function bind(){
    doc.addEventListener("click", function(ev){
      unlockAudio();
      var t = ev.target;
      if (!t || !t.closest) { return; }
      if (t.closest(".sbk2-dock")) { return; }
      var o = t.closest(".opt");
      if (!o) { return; }
      play("click");
      o.classList.add("sbk2-press");
      setTimeout(function(){ o.classList.remove("sbk2-press"); }, 170);
    }, true);
    doc.addEventListener("pointerdown", function(ev){
      unlockAudio();
      if (reduced) { return; }
      var t = ev.target;
      if (!t || !t.closest) { return; }
      var o = t.closest(".opt");
      if (o) { o.classList.add("sbk2-press"); }
    }, true);
  }

  /* ==========================================================
     7. 音频控制坞：BGM 开关 + 音量 + 音效开关
     ========================================================== */
  /* 线性 SVG 图标（stroke=currentColor，跟随主题）。
     ⚠️ 绝不用 emoji（🔊🎵）：emoji 本身就是「廉价卡通贴纸」观感的来源，
     与用户「摒弃简陋廉价卡通贴纸、整体精致高级」的要求直接冲突。 */
  function svg(inner){
    return '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" ' +
      'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" ' +
      'stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
  }
  var ICON_SND_ON  = svg('<path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z"/>' +
    '<path d="M15.6 9.2a4 4 0 0 1 0 5.6"/><path d="M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/>');
  var ICON_SND_OFF = svg('<path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z"/>' +
    '<path d="M16.2 9.8l4.4 4.4M20.6 9.8l-4.4 4.4"/>');
  var ICON_BGM_ON  = svg('<path d="M9 18V6.4l10-2v11.2"/>' +
    '<circle cx="6.6" cy="18" r="2.4"/><circle cx="16.6" cy="15.6" r="2.4"/>');
  var ICON_BGM_OFF = svg('<path d="M9 18V6.4l10-2v7.4"/>' +
    '<circle cx="6.6" cy="18" r="2.4"/><path d="M16.8 13.2l4.6 4.6M21.4 13.2l-4.6 4.6"/>');
  function buildDock(){
    if (doc.querySelector(".sbk2-dock")) { return; }
    var d = doc.createElement("div");
    d.className = "sbk2-dock";

    var snd = doc.createElement("button");
    snd.type = "button"; snd.className = "sbk2-ib";
    snd.title = "音效开关";
    var bgm = doc.createElement("button");
    bgm.type = "button"; bgm.className = "sbk2-ib";
    bgm.title = "背景音乐开关";
    var volEl = doc.createElement("input");
    volEl.type = "range"; volEl.className = "sbk2-vol";
    volEl.min = "0"; volEl.max = "100"; volEl.step = "5";
    volEl.value = String(Math.round(vol * 100));
    volEl.title = "音量";

    d.appendChild(snd); d.appendChild(bgm); d.appendChild(volEl);
    doc.body.appendChild(d);

    function paint(){
      snd.innerHTML = sfxOn ? ICON_SND_ON : ICON_SND_OFF;
      snd.setAttribute("aria-pressed", sfxOn ? "true" : "false");
      snd.classList.toggle("sbk2-off", !sfxOn);
      snd.title = sfxOn ? "音效：开" : "音效：关";
      bgm.innerHTML = bgmOn ? ICON_BGM_ON : ICON_BGM_OFF;
      bgm.setAttribute("aria-pressed", bgmOn ? "true" : "false");
      bgm.classList.toggle("sbk2-off", !bgmOn);
      bgm.title = bgmOn ? "背景音乐：开" : "背景音乐：关";
    }
    paint();

    snd.addEventListener("click", function(e){
      e.stopPropagation(); unlockAudio();
      sfxOn = !sfxOn; writeLS(P_SFX, sfxOn ? "1" : "0");
      if (sfxOn) { play("click"); } else { bgmStop(); }
      paint();
    });
    bgm.addEventListener("click", function(e){
      e.stopPropagation(); unlockAudio();
      bgmOn = !bgmOn; writeLS(P_BGM, bgmOn ? "1" : "0");
      if (bgmOn) { bgmStart(); play("click"); } else { bgmStop(); }
      paint();
    });
    volEl.addEventListener("input", function(){
      vol = Math.max(0, Math.min(1, (parseFloat(volEl.value) || 0) / 100));
      writeLS(P_VOL, String(vol));
      if (master) { try { master.gain.value = vol; } catch(e){} }
    });
    volEl.addEventListener("click", function(e){ e.stopPropagation(); });
  }

  /* ==========================================================
     8. 切题音：观察题库变化，播极轻的引导音
     ========================================================== */
  function watchTurn(){
    if (window.MutationObserver && doc.getElementById("quiz")) {
      var host = doc.getElementById("quiz");
      var mo = new MutationObserver(function(){ if (unlocked) { play("turn"); } });
      mo.observe(host, {childList:true});
    }
  }

  /* ---------- 启动 ---------- */
  function boot(){
    root.classList.add("sbk2");
    buildBackdrop();
    buildDock();
    bind();
    watch();
    watchTurn();
    runIn();
    /* 音频解锁闸门：挂在真实用户手势上。keydown/touchstart 一并挂上，
       兼顾键盘操作与旧触屏。 */
    ["pointerdown","click","keydown","touchstart"].forEach(function(ev){
      doc.addEventListener(ev, unlockAudio, {passive:true});
    });
    /* 切题时重新播放入场动画 */
    if (window.MutationObserver && doc.getElementById("quiz")) {
      var host2 = doc.getElementById("quiz");
      var mo2 = new MutationObserver(function(){ seenState = new WeakSet(); setTimeout(runIn, 60); });
      mo2.observe(host2, {childList:true});
    }
  }
  if (doc.readyState === "loading") {
    doc.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
<script>
/* __SBK_JS__ */
/* ============================================================
   sb-kids 一年级游戏增强层（音效 / 动效 / 背景装饰）
   ------------------------------------------------------------
   ⚠ 本段**不修改任何判分逻辑**，只「观察」：
     · 选项点击：捕获阶段监听 click，只播音效 + 加按压类，**不 preventDefault、
       不 stopPropagation**，引擎的 choose() 照常执行。
     · 正误判定：MutationObserver 盯 #fb / .fb / #feedbackBar 的 class，
       识别出 ok / no 后播对应音效与奖励 / 提示动画。
     · 题目切换：盯 #title / #stage / #opts 的 childList 变化，播进入动画 + 提示音。
   引擎将来重写也不影响本层（它只认 DOM 约定）。
   ============================================================ */
(function () {
  "use strict";
  if (document.documentElement.getAttribute("data-sbk") === "1") { return; }  // 幂等
  document.documentElement.setAttribute("data-sbk", "1");

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------------------------------------------------
     1. Web Audio：全部音效现场合成，零文件依赖
     --------------------------------------------------------- */
  var AC = window.AudioContext || window.webkitAudioContext;
  var ac = null, master = null;
  var sndOn = true, bgmOn = false;      /* 音效默认开；BGM 默认关（有声环境下不擅自播） */
  var BGM_KEY = "sbk_sound";
  /* ⚠️⚠️ 浏览器自动播放策略：用户产生任何交互手势（pointerdown/click/keydown）之前，
     **绝对不能 new AudioContext()**，否则 Chrome 会在控制台反复报
     "The AudioContext was not allowed to start" 警告，且声音也不会响。
     所以这里用一个「已解锁」闸门：闸门未开时 audio() 直接返回 null，
     所有 play/bgm 都自然空转，不产生任何报错。 */
  var unlocked = false;

  function audio() {
    if (!AC || !unlocked) { return null; }
    if (!ac) {
      try {
        ac = new AC();
        master = ac.createGain();
        master.gain.value = 0.5;
        master.connect(ac.destination);
      } catch (e) { ac = null; }
    }
    /* 闸门已开但上下文仍可能被暂停（如切到后台标签页回来），补一次 resume */
    if (ac && ac.state === "suspended") { try { ac.resume(); } catch (e) {} }
    return ac;
  }
  /* 首次用户手势时调用：开闸 + 恢复上下文 + 按需起 BGM */
  function unlockAudio() {
    if (unlocked) { return; }
    unlocked = true;
    var a = audio();
    if (a) { try { a.resume(); } catch (e) {} }
    if (bgmOn) { bgmStart(); }
  }
  function env(node, t0, a, d, peak) {
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    node.connect(g); g.connect(master);
    return g;
  }
  function tone(freq, t0, dur, type, peak) {
    var o = ac.createOscillator();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    env(o, t0, Math.min(0.02, dur * 0.25), dur, peak == null ? 0.3 : peak);
    o.start(t0); o.stop(t0 + dur + 0.06);
    return o;
  }
  /* 频率滑音（滑音本身就有"跳起来"的听感，比纯 beep 更活泼） */
  function slide(f0, f1, t0, dur, type, peak) {
    var o = ac.createOscillator();
    o.type = type || "triangle";
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    env(o, t0, 0.012, dur, peak == null ? 0.26 : peak);
    o.start(t0); o.stop(t0 + dur + 0.06);
  }

  /* —— 五种音效 —— */
  var SFX = {
    /* 点击：短促清脆的「叮」，音高偏高（一年级对高频更敏感） */
    click: function (t) { tone(1180, t, 0.055, "sine", 0.16); tone(1760, t + 0.012, 0.05, "sine", 0.09); },
    /* 答对：C-E-G-C 上行大跳 + 高音，标准"答对"感 */
    right: function (t) {
      tone(523.25, t, 0.12, "triangle", 0.26);
      tone(659.25, t + 0.09, 0.12, "triangle", 0.26);
      tone(783.99, t + 0.18, 0.12, "triangle", 0.26);
      tone(1046.5, t + 0.27, 0.34, "sine", 0.3);
    },
    /* 答错：柔和的下行小三度，绝不用刺耳的蜂鸣（吓到孩子） */
    wrong: function (t) {
      tone(392, t, 0.14, "sine", 0.2);
      tone(311.13, t + 0.11, 0.24, "sine", 0.18);
    },
    /* 题目开始：两声上行邀请音 */
    start: function (t) { tone(659.25, t, 0.1, "sine", 0.2); tone(880, t + 0.1, 0.16, "sine", 0.22); },
    /* 结算：一串小乐句 */
    finish: function (t) {
      var f = [523.25, 659.25, 783.99, 1046.5];
      for (var i = 0; i < f.length; i++) { tone(f[i], t + i * 0.13, 0.2, "triangle", 0.26); }
    }
  };
  function play(name) {
    if (!sndOn || !SFX[name]) { return; }
    var a = audio(); if (!a) { return; }
    try { SFX[name](a.currentTime + 0.01); } catch (e) {}
  }

  /* —— 轻快背景音乐：16 步循环，音量压到 0.1 当背景 ——
     用 setInterval 调度（不用 AudioBufferSource，好处是能随时开关/变速）。 */
  var bgmTimer = null, bgmStep = 0;
  var BGM_SEQ = [
    /* C 大调五声音阶拨弦，节奏轻快不吵 */
    [523.25, 659.25, 783.99, 1046.5, 783.99, 659.25, 587.33, 0],
    [523.25, 659.25, 783.99, 1046.5, 880, 783.99, 659.25, 0]
  ];
  function bgmTick() {
    if (!bgmOn || !sndOn) { return; }
    var a = audio(); if (!a) { return; }
    try {
      var row = BGM_SEQ[bgmStep % BGM_SEQ.length];
      for (var i = 0; i < row.length; i++) {
        if (!row[i]) { continue; }
        var t = a.currentTime + i * 0.19;
        var o = a.createOscillator();
        o.type = "triangle";
        o.frequency.setValueAtTime(row[i], t);
        env(o, t, 0.02, 0.17, 0.075);      /* 音量刻意压低，确保人声/解析优先 */
        o.start(t); o.stop(t + 0.24);
      }
    } catch (e) {}
    bgmStep++;
  }
  function bgmStart() {
    if (bgmTimer) { return; }
    /* 闸门未开（用户还没交互）时不排程：bgmTick 里的 audio() 会返回 null，
       排了 interval 也是空转，还白占一个定时器。等 unlockAudio 时再起。 */
    if (!unlocked) { return; }
    bgmTick();
    bgmTimer = setInterval(bgmTick, 1520);   /* 8 步 × 0.19s */
  }
  function bgmStop() { if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } }

  function loadPref() {
    try { var o = JSON.parse(localStorage.getItem(BGM_KEY) || "{}");
      if (typeof o.snd === "boolean") { sndOn = o.snd; }
      if (typeof o.bgm === "boolean") { bgmOn = o.bgm; }
    } catch (e) {}
  }
  function savePref() {
    try { localStorage.setItem(BGM_KEY, JSON.stringify({ snd: sndOn, bgm: bgmOn })); } catch (e) {}
  }

  /* ---------------------------------------------------------
     2. 卡通背景装饰层
     --------------------------------------------------------- */
  function deco() {
    document.body.classList.add("sbk-on", "sbk");
    var box = document.createElement("div");
    box.className = "sbk-deco";
    box.setAttribute("aria-hidden", "true");
    var html = [];
    /* 云朵 3 朵（左→右慢速） */
    for (var i = 0; i < 3; i++) {
      var top = 6 + i * 21, dur = 62 + i * 22, size = 0.8 + i * 0.28;
      html.push('<span class="sbk-cl" style="top:' + top + 'vh;width:0;height:0;'
        + 'animation:sbk-drift ' + dur + 's linear infinite;animation-delay:-' + (i * 17) + 's;'
        + 'transform:scale(' + size + ')"><i></i></span>');
    }
    /* 反向云 */
    html.push('<span class="sbk-cl" style="top:52vh;width:0;height:0;'
      + 'animation:sbk-drift-r 88s linear infinite;animation-delay:-31s;transform:scale(.7)"><i></i></span>');
    /* 星星：闪烁（各不同周期） */
    var stars = ["✨", "⭐", "🌟", "✨", "⭐", "🌟", "✨", "⭐"];
    for (var s = 0; s < stars.length; s++) {
      var L = 5 + (s * 13) % 88, T = 5 + (s * 19) % 78;
      html.push('<span class="sbk-st ' + (s % 3 === 0 ? "" : "s" + (s % 3 === 0 ? 2 : s % 3)) + '"'
        + ' style="left:' + L + '%;top:' + T + 'vh;'
        + 'animation:sbk-tw ' + (2.4 + s * 0.42) + 's ease-in-out infinite;'
        + 'animation-delay:-' + (s * 0.63) + 's">' + stars[s] + "</span>");
    }
    /* 彩虹：右侧空白区完整露出（top 会被卡片压住，见 CSS 注释） */
    html.push('<span class="sbk-rb" style="right:3%;bottom:19vh"></span>');
    /* 气球：底部两侧，上下浮动 */
    var bal = ["🎈", "🎈", "🎈", "🎈"];
    for (var bI = 0; bI < bal.length; bI++) {
      var bl = 4 + bI * 27, bd = 6.4 + bI * 1.3;
      html.push('<span class="sbk-ba" style="left:' + bl + '%;bottom:6vh;'
        + 'animation:sbk-float ' + bd + 's ease-in-out infinite;animation-delay:-' + (bI * 1.4) + 's">'
        + bal[bI] + "</span>");
    }
    /* 小动物 / 校园剪影：蹲底部，弱化 */
    var an = ["🐰", "🐻", "🐱", "🏫", "🌳", "🐥"];
    for (var aI = 0; aI < an.length; aI++) {
      var al = 2 + aI * 16.5;
      html.push('<span class="sbk-an" style="left:' + al + '%;bottom:1.5vh;'
        + 'animation:sbk-bob ' + (3.6 + aI * 0.5) + 's ease-in-out infinite;'
        + 'animation-delay:-' + (aI * 0.8) + 's">' + an[aI] + "</span>");
    }
    box.innerHTML = html.join("");
    document.body.appendChild(box);
  }

  /* ---------------------------------------------------------
     3. 特效：星星 / 彩带 / 笑脸 / 温和提示气泡
     --------------------------------------------------------- */
  function fx() {
    if (reduced) { return null; }
    var b = document.createElement("div");
    b.className = "sbk-fx";
    b.setAttribute("aria-hidden", "true");
    document.body.appendChild(b);
    return b;
  }
  function burstRight(host) {
    var box = fx();
    /* 彩带：从正确项位置向上撒五色纸片 */
    var R = host ? host.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
    if (box) {
      var cols = ["#ff8fb1", "#ffd23f", "#5ec26a", "#4aa3ff", "#a98bff", "#ff9f45"];
      for (var i = 0; i < 22; i++) {
        var rb = document.createElement("span");
        rb.className = "sbk-ribbon";
        rb.style.left = (R.left + R.width / 2) + "px";
        rb.style.top = (R.top + R.height / 2) + "px";
        rb.style.background = cols[i % cols.length];
        rb.style.setProperty("--dx", (Math.random() * 260 - 130) + "px");
        rb.style.setProperty("--dy", (180 + Math.random() * 200) + "px");
        rb.style.setProperty("--rot", (Math.random() * 900 - 450) + "deg");
        rb.style.animationDelay = (Math.random() * 0.16) + "s";
        box.appendChild(rb);
      }
      /* 星星：分两批从中心迸开 */
      for (var k = 0; k < 14; k++) {
        var st = document.createElement("span");
        st.className = "sbk-star";
        st.textContent = k % 3 === 0 ? "🌟" : (k % 3 === 1 ? "⭐" : "✨");
        st.style.left = (R.left + R.width / 2) + "px";
        st.style.top = (R.top + R.height / 2) + "px";
        st.style.setProperty("--dx", (Math.random() * 320 - 160) + "px");
        st.style.setProperty("--dy", -(90 + Math.random() * 200) + "px");
        st.style.animationDelay = (Math.random() * 0.22) + "s";
        st.style.fontSize = (20 + Math.random() * 16) + "px";
        box.appendChild(st);
      }
      setTimeout(function () { if (box.parentNode) { box.parentNode.removeChild(box); } }, 1900);
    }
    /* 笑脸 + 点赞：屏幕中央的独立层（不吃掉上面的事件） */
    var c = document.createElement("div");
    c.className = "sbk-cheer";
    c.setAttribute("aria-hidden", "true");
    var faces = ["😄", "🎉", "👏", "😃", "🌟"];
    var words = ["答对啦！", "太棒了！", "真厉害！", "好样的！", "满分哦！"];
    var idx = Math.floor(Math.random() * faces.length);
    c.innerHTML = '<div class="sbk-face">' + faces[idx] + "</div>"
                + '<div class="sbk-word">' + words[idx] + "</div>";
    document.body.appendChild(c);
    setTimeout(function () { if (c.parentNode) { c.parentNode.removeChild(c); } }, 1300);
  }
  function hintWrong(host) {
    if (reduced || !host) { return; }
    var r = host.getBoundingClientRect();
    var h = document.createElement("div");
    h.className = "sbk-hint";
    h.setAttribute("aria-hidden", "true");
    h.textContent = ["再想一想～", "差一点点！", "看看题目哦", "不着急，再试试"][Math.floor(Math.random() * 4)];
    h.style.left = Math.max(80, Math.min(innerWidth - 80, r.left + r.width / 2)) + "px";
    h.style.top = Math.max(70, r.top - 6) + "px";
    document.body.appendChild(h);
    setTimeout(function () { if (h.parentNode) { h.parentNode.removeChild(h); } }, 1650);
  }

  /* ---------------------------------------------------------
     4. 题目进入动画 + 开始提示音
     --------------------------------------------------------- */
  var seenQ = "";                 /* 记住当前题干，避免同一题反复播提示音 */
  function animIn(node, cls, delay) {
    if (!node || reduced) { return; }
    /* 防御：若环境把 CSS 动画整体禁掉（引擎在 prefers-reduced-motion 下
       会写 `*{animation:none !important}`），就不要加动画 class。 */
    if (!canAnimate()) { return; }
    node.classList.remove(cls);
    /* 强制 reflow 让动画能重放（同 class 连续加不会重新触发动画） */
    void node.offsetWidth;
    node.style.animationDelay = (delay || 0) + "s";
    node.classList.add(cls);
    /* ⚠️ 保险丝：动画若因任何原因没能推进（标签页被节流、渲染中断、
       动画时钟卡死等），元素会永远停在 from 帧的位移/缩放上 ——
       虽然不再影响文字可见性（keyframes 已不碰 opacity），
       但选项会一直偏在下方并缩小，看着像没加载出来。
       这里超时后直接把 class 摘掉，回到自然位置。 */
    clearTimeout(node._sbkFuse);
    node._sbkFuse = setTimeout(function () {
      if (!node.classList.contains(cls)) { return; }
      var list = node.getAnimations ? node.getAnimations() : [];
      var stuck = true;
      for (var i = 0; i < list.length; i++) {
        /* playState 仍是 running 说明没播完（可能只是还在正常播）；
           真正卡死的是 currentTime 一点没推进。用后者判定。 */
        if ((list[i].currentTime || 0) > 0) { stuck = false; break; }
      }
      if (stuck) { node.classList.remove(cls); }
    }, 1500);
  }
  var _canAnimate = null;
  /* ⚠️ 探测必须用**真实存在**的 @keyframes 名（如 sbk-in-opt）。
     用不存在的名字（如 sbk-nonexistent-probe）浏览器不会创建动画实例，
     getAnimations() 恒为空 → canAnimate 恒 false → 真实浏览器里动画被全部误杀。
     再把动画冻结在起始帧，确认 from 帧的 transform 真的生效
     （keyframes 现在只动 transform，不动 opacity）。 */
  function canAnimate() {
    if (_canAnimate !== null) { return _canAnimate; }
    var probe = document.createElement("div");
    probe.style.cssText = "position:absolute;left:-9999px;top:0;width:1px;height:1px;pointer-events:none";
    probe.className = "sbk-in-opt";
    document.body.appendChild(probe);
    var running = false;
    try {
      var list = probe.getAnimations ? probe.getAnimations() : [];
      running = list.length > 0;
      if (running && list[0]) {
        list[0].pause();
        list[0].currentTime = 0;
        var tf = getComputedStyle(probe).transform;
        /* from 帧是 translateY(14px) scale(.92)，矩阵不应是单位矩阵 */
        running = !!tf && tf !== "none" && tf.indexOf("matrix") === 0;
      }
    } catch (e) { running = false; }
    if (probe.parentNode) { probe.parentNode.removeChild(probe); }
    _canAnimate = running;
    return running;
  }
  function questionIn() {
    var q = document.getElementById("q") || document.getElementById("gameContainer")
         || document.querySelector(".q") || document.querySelector(".wrap");
    animIn(q, "sbk-in", 0);
    var opts = document.querySelectorAll("#opts .opt, .optionsGrid button, .opt");
    for (var i = 0; i < opts.length; i++) { animIn(opts[i], "sbk-in-opt", 0.06 + i * 0.07); }
  }
  function maybeStartTone() {
    var t = document.getElementById("title") || document.getElementById("promptText");
    var key = t ? (t.textContent || "").trim() : "";
    if (!key) { return; }
    if (key !== seenQ) { seenQ = key; play("start"); }
  }

  /* ---------------------------------------------------------
     5. 挂钩：全部在「观察」，不干预判分
     --------------------------------------------------------- */
  function isOpt(b) {
    if (!b || b.nodeType !== 1) { return false; }
    if (b.classList && (b.classList.contains("opt") || b.classList.contains("optbtn"))) { return true; }
    var p = b.closest ? b.closest(".opt,.optbtn") : null;
    if (p) { return true; }
    /* optionsGrid 这类异类结构：按钮且在选项容器里 */
    var og = b.closest ? b.closest("#optionsGrid,.optionsGrid,.opts") : null;
    return !!(og && og.tagName !== "BODY" && b.tagName === "BUTTON");
  }
  function bubble(b) {
    if (reduced || !b) { return; }
    var r = b.getBoundingClientRect();
    var e = document.createElement("span");
    e.className = "sbk-bubble";
    e.style.left = (r.left + r.width / 2) + "px";
    e.style.top = (r.top + r.height / 2) + "px";
    document.body.appendChild(e);
    setTimeout(function () { if (e.parentNode) { e.parentNode.removeChild(e); } }, 560);
  }

  /* 5a. 选项点击：捕获阶段，只加动效与音效，不阻断引擎 */
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    /* ⚠️ 必须在 play() 之前开闸：本监听是**捕获阶段**，比 boot() 里挂在
       冒泡阶段的 unlockAudio 先跑。若不在这里解锁，孩子第一次点选项就听不到
       点击音（闸门还没开）。unlockAudio 内部有幂等守卫，重复调用无副作用。 */
    unlockAudio();
    /* 音效/音乐开关自己不播点击音（否则会自我循环） */
    if (t && t.closest && t.closest(".sbk-bar")) { return; }
    if (!isOpt(t)) { return; }
    var b = t.closest ? (t.closest(".opt,.optbtn") || t) : t;
    play("click");
    bubble(b);
    b.classList.add("sbk-press");
    setTimeout(function () { b.classList.remove("sbk-press"); }, 180);
  }, true);
  /* pointerdown 也要有按压感：click 在触摸端有 300ms 延迟，
     立刻按压更跟手。仍然只改 class，不阻止任何事。 */
  document.addEventListener("pointerdown", function (ev) {
    unlockAudio();
    if (reduced || !isOpt(ev.target)) { return; }
    var b = ev.target.closest ? (ev.target.closest(".opt,.optbtn") || ev.target) : ev.target;
    if (b && b.classList) { b.classList.add("sbk-press"); }
  }, true);

  /* 5b. 正误反馈：盯 class 变化，识别 ok / no */
  var lastFb = "";
  function feedback() {
    var fb = document.getElementById("fb") || document.querySelector(".fb")
          || document.getElementById("feedbackBar") || document.querySelector("#feedbackBar,.feedback");
    if (!fb) { return; }
    var cl = fb.className || "";
    var ok = /(^|\s)(ok|right|correct)(\s|$)/.test(cl);
    var no = /(^|\s)(no|wrong|bad)(\s|$)/.test(cl);
    var st = ok ? "ok" : (no ? "no" : "");
    if (!st || st === lastFb) { return; }
    lastFb = st;
    if (st === "ok") {
      play("right");
      var good = document.querySelector(".opt.right,.opt.ok,#optionsGrid .right,#optionsGrid .ok")
              || document.querySelector(".opt:not(.dim)");
      if (good) {
        good.classList.remove("sbk-right");
        void good.offsetWidth;
        good.classList.add("sbk-right");
        setTimeout(function () { good.classList.remove("sbk-right"); }, 1500);
      }
      burstRight(good);
    } else {
      play("wrong");
      var bad = document.querySelector(".opt.wrong,.opt.no,#optionsGrid .wrong,#optionsGrid .no");
      if (bad) {
        bad.classList.remove("sbk-wrong");
        void bad.offsetWidth;
        bad.classList.add("sbk-wrong");
        setTimeout(function () { bad.classList.remove("sbk-wrong"); }, 700);
        hintWrong(bad);
      }
    }
  }

  /* 5c. 题目切换：选项容器内容变化 = 换题了 */
  function watchQuestion() {
    var opts = document.getElementById("opts") || document.querySelector(".opts")
            || document.getElementById("optionsGrid") || document.querySelector(".optionsGrid");
    if (opts && window.MutationObserver) {
      new MutationObserver(function () {
        /* 延一帧：等 innerHTML 全部替换完 */
        setTimeout(function () { questionIn(); maybeStartTone(); }, 30);
      }).observe(opts, { childList: true, subtree: true });
    }
    var t = document.getElementById("title") || document.getElementById("promptText");
    if (t && window.MutationObserver) {
      new MutationObserver(function () { setTimeout(questionIn, 20); })
        .observe(t, { childList: true, characterData: true, subtree: true });
    }
    if (document.body && window.MutationObserver) {
      new MutationObserver(function () { setTimeout(feedback, 20); })
        .observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class"] });
    }
  }

  /* ---------------------------------------------------------
     6. 音效 / 音乐开关（浮动两个圆钮）
     --------------------------------------------------------- */
  function switchBar() {
    var bar = document.createElement("div");
    bar.className = "sbk-bar";
    var snd = document.createElement("button");
    snd.type = "button"; snd.className = "sbk-ico sbk-sound";
    snd.title = "音效开关";
    snd.setAttribute("aria-label", "音效开关");
    snd.setAttribute("aria-pressed", sndOn ? "true" : "false");
    var bgm = document.createElement("button");
    bgm.type = "button"; bgm.className = "sbk-ico";
    bgm.title = "背景音乐开关";
    bgm.setAttribute("aria-label", "背景音乐开关");
    bgm.setAttribute("aria-pressed", bgmOn ? "true" : "false");
    function paint() {
      snd.textContent = sndOn ? "🔊" : "🔇";
      snd.classList.toggle("sbk-off", !sndOn);
      snd.setAttribute("aria-pressed", sndOn ? "true" : "false");
      bgm.textContent = bgmOn ? "🎵" : "🎶";
      bgm.classList.toggle("sbk-off", !bgmOn);
      bgm.setAttribute("aria-pressed", bgmOn ? "true" : "false");
    }
    snd.addEventListener("click", function (e) {
      e.stopPropagation();
      unlockAudio();                     /* 开关本身也是用户手势，要能立刻出声 */
      sndOn = !sndOn;
      if (!sndOn) { bgmStop(); }         /* 关音效必然连带停 BGM，否则静音播放更怪 */
      else { var a = audio(); if (a) { try { SFX.click(a.currentTime + 0.01); } catch (er) {} } }
      savePref(); paint();
    });
    bgm.addEventListener("click", function (e) {
      e.stopPropagation();
      unlockAudio();
      bgmOn = !bgmOn;
      if (bgmOn) { bgmStart(); var a = audio();
        if (a) { try { SFX.start(a.currentTime + 0.01); } catch (er) {} } }
      else { bgmStop(); }
      savePref(); paint();
    });
    bar.appendChild(snd); bar.appendChild(bgm);
    document.body.appendChild(bar);
    paint();
  }

  /* ---------------------------------------------------------
     7. 启动
     --------------------------------------------------------- */
  function boot() {
    loadPref();
    deco();
    switchBar();
    watchQuestion();
    questionIn();
    setTimeout(maybeStartTone, 260);
    /* ⚠️ 音频解锁闸门：必须挂在**真实用户手势**上。
       之前用 setTimeout(maybeStartTone) 在页面加载后就 play("start")，
       此时还没有任何手势 → 浏览器拒绝启动 AudioContext，控制台刷出一串
       "The AudioContext was not allowed to start" 警告。
       现在 audio() 内部有 unlocked 闸门，加载期所有发声都空转且不报错；
       这里在首次手势时开闸。keydown/touchstart 一并挂上，兼顾键盘与旧触屏。 */
    ["pointerdown", "click", "keydown", "touchstart"].forEach(function (ev) {
      document.addEventListener(ev, unlockAudio, { passive: true });
    });
    /* 结算页：把「再玩一次 / 重来」换成本层配色（它们的类名各游戏不同，
       用语义类兜底，见 CSS 里的 .btn / .resetBtn / #resetBtn） */
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
