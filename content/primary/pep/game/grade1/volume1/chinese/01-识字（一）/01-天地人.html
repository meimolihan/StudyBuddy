<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字小使者 · 天地人闯关</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    background: linear-gradient(160deg, #e8f5e9 0%, #e3f2fd 45%, #fff8e1 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    padding: 16px;
  }

  .game-container {
    width: 100%;
    max-width: 740px;
    background: #ffffff;
    border-radius: 28px;
    box-shadow: 0 12px 40px rgba(44, 62, 80, 0.12), 0 2px 8px rgba(44, 62, 80, 0.06);
    padding: 24px 28px 28px;
    position: relative;
  }

  /* 顶部状态栏 */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .level-badge {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #27ae60, #1e8449);
    padding: 7px 18px;
    border-radius: 50px;
    letter-spacing: 1px;
  }

  .score-box {
    font-size: 15px;
    font-weight: 700;
    color: #2c3e50;
    background: #f0f3f4;
    padding: 7px 18px;
    border-radius: 50px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .score-box .star { color: #f1c40f; font-size: 18px; }

  /* 进度条 */
  .progress-track {
    width: 100%;
    height: 10px;
    background: #ecf0f1;
    border-radius: 10px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #27ae60, #2ecc71);
    border-radius: 10px;
    width: 0%;
    transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* 题目区 */
  .question-area {
    text-align: center;
    margin-bottom: 8px;
  }

  .prompt-text {
    font-size: 19px;
    font-weight: 700;
    color: #2c3e50;
    margin-bottom: 14px;
    letter-spacing: 1px;
    min-height: 28px;
    line-height: 1.4;
  }

  .visual-area {
    min-height: 190px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 18px;
  }

  /* 看图猜字 —— 图片区 */
  .picture-card {
    background: #f8fbfc;
    border: 3px solid #e0e8ec;
    border-radius: 22px;
    padding: 20px 28px;
    text-align: center;
    transition: transform 0.3s;
  }

  .picture-emoji {
    font-size: 82px;
    line-height: 1.1;
    display: block;
  }

  .picture-label {
    font-size: 15px;
    color: #7f8c8d;
    font-weight: 600;
    margin-top: 6px;
  }

  /* 听音选字 —— 提示区 */
  .sound-card {
    background: linear-gradient(135deg, #fff8e1, #fef9e7);
    border: 3px dashed #f5b041;
    border-radius: 22px;
    padding: 22px 36px;
    text-align: center;
  }

  .sound-icon {
    font-size: 52px;
    display: block;
    margin-bottom: 6px;
  }

  .sound-hint {
    font-size: 17px;
    color: #b9770e;
    font-weight: 700;
    letter-spacing: 1px;
  }

  /* 汉字演变动画 */
  .evolution-stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .evo-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .evo-glyph {
    font-size: 56px;
    line-height: 1;
    color: #2c3e50;
    font-weight: 700;
    min-width: 78px;
    text-align: center;
    transition: transform 0.3s;
  }

  .evo-glyph.ancient {
    font-family: "KaiTi", "STKaiti", "SimSun", serif;
    color: #8e44ad;
    font-size: 52px;
    font-weight: 400;
  }

  .evo-label {
    font-size: 12px;
    color: #95a5a6;
    font-weight: 600;
  }

  .evo-arrow {
    font-size: 22px;
    color: #bdc3c7;
    padding-bottom: 18px;
  }

  /* 人称代词 —— 句子语境 */
  .sentence-card {
    background: #f0f8ff;
    border: 3px solid #aed6f1;
    border-radius: 22px;
    padding: 22px 30px;
    text-align: center;
    max-width: 520px;
  }

  .sentence-text {
    font-size: 21px;
    font-weight: 700;
    color: #2c3e50;
    line-height: 1.8;
    letter-spacing: 1px;
  }

  .sentence-blank {
    display: inline-block;
    min-width: 52px;
    border-bottom: 3px solid #e67e22;
    color: #e67e22;
    font-size: 24px;
    font-weight: 900;
    text-align: center;
    margin: 0 4px;
  }

  /* 关卡过渡 */
  .level-transition {
    font-size: 26px;
    font-weight: 900;
    color: #27ae60;
    text-align: center;
    line-height: 1.6;
  }

  /* 选项网格 */
  .options-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 14px;
  }

  .option-btn {
    font-size: 30px;
    font-weight: 900;
    padding: 18px 10px;
    border: 3px solid #d5dbdb;
    border-radius: 18px;
    background: #f8fbfc;
    color: #2c3e50;
    cursor: pointer;
    transition: transform 0.18s, border-color 0.25s, box-shadow 0.25s, background 0.25s;
    font-family: inherit;
    letter-spacing: 4px;
    line-height: 1.2;
  }

  .option-btn .opt-pinyin {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #95a5a6;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .option-btn:hover {
    border-color: #85c1e9;
    background: #f0f8ff;
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(52, 152, 219, 0.16);
  }

  .option-btn:active { transform: translateY(-1px) scale(0.98); }

  .option-btn.correct {
    border-color: #2ecc71;
    background: #eafaf1;
    color: #27ae60;
    animation: correctPulse 0.5s ease;
  }

  .option-btn.wrong {
    border-color: #e74c3c;
    background: #fdedec;
    color: #c0392b;
    animation: shake 0.45s ease;
  }

  .option-btn.dimmed {
    opacity: 0.4;
    pointer-events: none;
  }

  @keyframes correctPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  /* 反馈 */
  .feedback-bar {
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    min-height: 42px;
    color: #2c3e50;
    letter-spacing: 0.5px;
    line-height: 1.5;
    padding: 0 6px;
  }

  .feedback-bar.good { color: #27ae60; }
  .feedback-bar.bad  { color: #e74c3c; }

  /* 通关面板 */
  .result-panel {
    text-align: center;
    padding: 10px 0 4px;
    display: none;
  }

  .result-panel h2 {
    font-size: 27px;
    color: #2c3e50;
    margin-bottom: 8px;
  }

  .result-panel .final-score {
    font-size: 19px;
    color: #e67e22;
    font-weight: 800;
    margin-bottom: 6px;
    line-height: 1.5;
  }

  .result-panel .medal {
    font-size: 76px;
    display: block;
    margin: 8px 0;
  }

  .btn-restart {
    margin-top: 14px;
    font-size: 17px;
    font-weight: 700;
    padding: 14px 48px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #27ae60, #1e8449);
    color: #fff;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 6px 18px rgba(39, 174, 96, 0.32);
    transition: transform 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }

  .btn-restart:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 26px rgba(39, 174, 96, 0.42);
  }

  /* 飘星 */
  .star-fall {
    position: fixed;
    font-size: 26px;
    pointer-events: none;
    z-index: 999;
    animation: starFall 1s ease-out forwards;
  }

  @keyframes starFall {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(90px) scale(0.4) rotate(60deg); }
  }

  /* 响应式 */
  @media (max-width: 520px) {
    .game-container { padding: 18px 16px 22px; border-radius: 22px; }
    .prompt-text { font-size: 16px; }
    .visual-area { min-height: 150px; }
    .picture-emoji { font-size: 60px; }
    .evo-glyph { font-size: 40px; min-width: 56px; }
    .evo-glyph.ancient { font-size: 38px; }
    .sentence-text { font-size: 17px; }
    .option-btn { font-size: 24px; padding: 14px 8px; border-radius: 14px; letter-spacing: 2px; }
    .options-grid { gap: 10px; }
    .feedback-bar { font-size: 14px; }
    .result-panel h2 { font-size: 21px; }
  }

/* ---- StudyBuddy 主题适配（2026-10-04 追加）----
   本文件是独立小游戏，自带一套浅色配色。为跟随站点的深色模式，
   这里只覆盖页面底色 / 卡片底 / 主文字色三处，
   其余彩色块（正确/错误/关卡色）刻意保留 —— 它们是语义色，
   在两种背景下都清晰，改了反而丢失反馈含义。
   变量由 /game/raw 注入（gameThemeBridgeCSS），双击直接打开时用这里的浅色 fallback。 */
@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]) body{background:var(--g-bg,#151a21)}
  html:not([data-theme="light"]) .game-container{background:var(--g-card,#1c222b); color:var(--g-ink,#e7ecf3)}
  html:not([data-theme="light"]) .score-box{background:var(--g-line,#2a323d); color:var(--g-ink,#e7ecf3)}
  html:not([data-theme="light"]) .prompt-text,
  html:not([data-theme="light"]) .feedback-bar,
  html:not([data-theme="light"]) .result-panel h2,
  html:not([data-theme="light"]) .evo-glyph{color:var(--g-ink,#e7ecf3)}
  html:not([data-theme="light"]) .option-btn{background:var(--g-card,#1c222b); color:var(--g-ink,#e7ecf3); border-color:var(--g-line,#2a323d)}
}
[data-theme="dark"] body{background:var(--g-bg,#151a21)}
[data-theme="dark"] .game-container{background:var(--g-card,#1c222b); color:var(--g-ink,#e7ecf3)}
[data-theme="dark"] .score-box{background:var(--g-line,#2a323d); color:var(--g-ink,#e7ecf3)}
[data-theme="dark"] .prompt-text,
[data-theme="dark"] .feedback-bar,
[data-theme="dark"] .result-panel h2,
[data-theme="dark"] .evo-glyph{color:var(--g-ink,#e7ecf3)}
[data-theme="dark"] .option-btn{background:var(--g-card,#1c222b); color:var(--g-ink,#e7ecf3); border-color:var(--g-line,#2a323d)}

</style>
<style>
/* __SBK_CSS__ */
.sbk{
  --sbk-blue:#4aa3ff;   --sbk-blue-s:#dbeeff;
  --sbk-yellow:#ffd23f; --sbk-yellow-s:#fff6d9;
  --sbk-orange:#ff9f45; --sbk-orange-s:#ffeedb;
  --sbk-green:#5ec26a;  --sbk-green-s:#e2f6e4;
  --sbk-pink:#ff8fb1;   --sbk-pink-s:#ffe6ee;
  --sbk-purple:#a98bff; --sbk-purple-s:#eee8ff;
  /* 浅底专用深色字：每个都 ≥7:1 对比度，**不引用 --g-ink**（见上方铁律）。
     刻意压得比纯黑稍浅一点，避免一年级长时间盯着刺眼。 */
  --sbk-blue-ink:#123a63;  --sbk-yellow-ink:#5c4400;
  --sbk-orange-ink:#7a3d00; --sbk-green-ink:#14532d;
  --sbk-pink-ink:#7d2244;   --sbk-purple-ink:#432a80;
  /* 正误反馈同样是浅底，文字也必须深色：--g-ok/--g-bad/--g-warn 暗色下是浅色 */
  --sbk-ok-ink:#0f5132;  --sbk-bad-ink:#8a1f1f;  --sbk-warn-ink:#6b4200;
  /* 随主题走的墨色：**只用于背景同样随主题变的元素**（卡片/顶栏/反馈条）*/
  --sbk-ink:var(--g-ink,#1f2937);
  --sbk-line:var(--g-line,#e3e9f1);
  --sbk-card:var(--g-card,#fff);
  --sbk-brand:var(--g-brand,#2f6fd0);
  --sbk-ok:var(--g-ok,#2e9e5b);
  --sbk-bad:var(--g-bad,#d64545);
  /* 柔和但明亮：避免高饱和纯色大面积铺满（刺眼），
     用「白 + 低饱和彩色」的组合，色相集中在蓝/黄/橙/绿/粉五色。 */
  --sbk-sky-1:#eaf4ff; --sbk-sky-2:#fff8ec; --sbk-sky-3:#f2fbf3;
}

body.sbk-on{
  background:
    radial-gradient(1100px 460px at 8% -8%,  var(--sbk-blue-s) 0%, transparent 62%),
    radial-gradient(900px 420px at 96% 4%,   var(--sbk-yellow-s) 0%, transparent 60%),
    radial-gradient(820px 500px at 50% 108%, var(--sbk-pink-s) 0%, transparent 64%),
    linear-gradient(180deg, var(--sbk-sky-1) 0%, var(--sbk-sky-2) 46%, var(--sbk-sky-3) 100%) !important;
  background-attachment: fixed !important;
}

/* ---------- 卡通装饰层（云朵 / 星星 / 彩虹 / 气球 / 校园） ----------
   纯 CSS 绘制，零图片依赖（离线双击也能看）。
   全部 pointer-events:none，绝不挡住孩子的点击。 */
.sbk-deco{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
/* ⚠️ 必须同时命中 <span>（deco() 注入的云/星/彩虹/气球/动物都是 span）
   与 <i>（云朵内部那块弧形底）。只写 i 会让全部 span 退化成 position:static，
   top/left/bottom 全部失效、22 个装饰挤在视口顶部一条线上。 */
.sbk-deco i,.sbk-deco>span{position:absolute; display:block; font-style:normal; line-height:1;
  will-change:transform; user-select:none}

/* 云朵：三个圆球拼一朵，缓慢横移。
   纯白在浅蓝/浅黄渐变底上几乎看不见（第一版实测整片云"消失"），
   改用带一点蓝的云白色 + 极淡描边，柔和但能分辨轮廓。 */
.sbk-cl{width:0; height:0}
.sbk-cl::before,.sbk-cl::after{content:""; position:absolute; border-radius:50%;
  background:#eef6ff; box-shadow:inset 0 0 0 1px rgba(150,185,225,.28)}
.sbk-cl::before{width:56px; height:56px; left:0; top:12px}
.sbk-cl::after{width:40px; height:40px; left:34px; top:2px;
  box-shadow:30px 22px 0 -2px #eef6ff, inset 0 0 0 1px rgba(150,185,225,.28)}
.sbk-cl i{position:absolute; left:52px; top:26px; width:46px; height:26px;
  border-radius:0 22px 22px 0; background:#eef6ff; opacity:.95;
  box-shadow:inset 0 0 0 1px rgba(150,185,225,.28)}

/* 星星：柔和闪烁，不刺眼（用饱和度较低的黄 + 半透明） */
.sbk-st{color:var(--sbk-yellow); font-size:22px; opacity:.75;
  text-shadow:0 0 10px rgba(255,210,63,.55)}
.sbk-st.s2{color:var(--sbk-orange); font-size:16px; opacity:.6}
.sbk-st.s3{color:var(--sbk-pink); font-size:18px; opacity:.55}

/* 气球：轻微上下浮动，线是伪元素 */
.sbk-ba{font-size:34px; animation:sbk-float 7s ease-in-out infinite}
.sbk-ba::after{content:""; position:absolute; left:50%; top:100%; width:1px;
  height:26px; background:rgba(120,130,150,.32); transform:translateX(-50%)}

/* 彩虹：同心环彩虹桥。
   ⚠️ 位置不能用 top:8px（会正好落在题目卡片背后，装饰层 z-index:0
   在卡片之下 → 只露出顶部一截彩色弧，看着像渲染 bug）。
   改锚到视口下方空白区，完整可见且不与卡片/气球/动物重叠。
   ⚠️ 也不能用 conic-gradient：它从圆心发散成楔形，出来是一把扇子而不是
   彩虹桥。必须用 radial-gradient 的多段硬色环，才是等宽的同心弧。 */
.sbk-rb{width:190px; height:95px; overflow:hidden; border-radius:190px 190px 0 0;
  background:
    radial-gradient(circle at 50% 100%,
      transparent 0 55px,
      #ff8fb1 55px 60.5px, #ff9f45 60.5px 66px, #ffd23f 66px 71.5px,
      #5ec26a 71.5px 77px, #4aa3ff 77px 82.5px, #a98bff 82.5px 88px,
      transparent 88px);
  opacity:.5}

/* 小动物 / 校园剪影：emoji，蹲在底部不抢视觉 */
.sbk-an{font-size:28px; opacity:.5; animation:sbk-bob 4.2s ease-in-out infinite}

/* 飘浮动画：三个元素用不同周期，避免整齐划一的机械感 */
@keyframes sbk-drift{from{transform:translateX(-14vw)}to{transform:translateX(114vw)}}
@keyframes sbk-drift-r{from{transform:translateX(114vw)}to{transform:translateX(-14vw)}}
@keyframes sbk-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
@keyframes sbk-bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
@keyframes sbk-tw{0%,100%{opacity:.35; transform:scale(.9)}50%{opacity:.85; transform:scale(1.1)}}

/* ---------- 主体内容浮到装饰层之上 ---------- */
.sbk-on .wrap,.sbk-on .hud,.sbk-on .q,.sbk-on .fb,.sbk-on .opts,.sbk-on .stage,
.sbk-on .done,.sbk-on #gameContainer,.sbk-on .gb,.sbk-on [class*="bar"],
.sbk-on [class*="card"],.sbk-on [class*="panel"]{
  position:relative; z-index:1;
}
.sbk-on #gameContainer{max-width:820px; margin:0 auto}

/* ---------- 大卡片：更圆、更软、有厚度感（不用重投影，避免糊） ---------- */
.sbk-on .q, .sbk-on #gameContainer, .sbk-on .fb{
  border-radius:24px !important;
  border:2px solid var(--sbk-line) !important;
  box-shadow:0 6px 0 rgba(0,0,0,.05), 0 10px 26px rgba(80,110,160,.13) !important;
  background-color:var(--sbk-card) !important;
}

/* ---------- 大字号：题干与选项是低龄阅读的主体，必须够大 ---------- */
.sbk-on .q-title, .sbk-on #promptText{
  font-size:22px !important; line-height:1.65 !important; font-weight:800 !important;
  letter-spacing:.01em;
}
.sbk-on .q-sub, .sbk-on #scoreText, .sbk-on #levelBadge{font-size:15px !important}
.sbk-on .stage{min-height:126px}
.sbk-on .stage .big{font-size:76px}
.sbk-on .stage .py{font-size:40px}
.sbk-on .stage .shape{font-size:64px}
.sbk-on .fb{font-size:17px !important; font-weight:700 !important;
  border-radius:18px !important; padding:12px 16px !important}

/* ⚠️ 不要在这里写 `.opt{opacity:1 !important}` 兜底 ——
   作者 `!important` 声明的优先级**高于 CSS 动画产生的值**，
   会把入场淡入动画（from opacity:0 → to opacity:1）整个废掉。
   可见性兜底已由下方「题目进入动画」处的
   `.sbk-in-opt{opacity:1}` + `fill-mode:backwards` 解决：
   动画被禁 → 无动画 → 元素取自身 opacity:1（可见）；
   动画正常   → 正常淡入。无需 !important。 */

/* ---------- 圆润大按钮 + 五色循环 ---------- */
/* 每个选项给一个色相（nth-child 轮转），孩子靠颜色也能定位选项，
   这对一年级认字不多的学生是很实在的辅助。 */
.sbk-on .opt, .sbk-on .optionsGrid button, .sbk-on .optbtn{
  min-height:62px !important;           /* 触屏热区：远高于 44px 下限 */
  border-radius:20px !important;
  border:3px solid transparent !important;
  font-size:19px !important; font-weight:800 !important;
  box-shadow:0 5px 0 var(--sbk-shadow,rgba(0,0,0,.10)) !important;
  transition:transform .14s cubic-bezier(.34,1.56,.64,1),
             box-shadow .14s, filter .2s !important;
  position:relative; overflow:hidden;
}
.sbk-on .opt:nth-child(5n+1),.sbk-on .optionsGrid button:nth-child(5n+1){
  background-color:var(--sbk-blue-s)!important; border-color:var(--sbk-blue)!important;
  color:var(--sbk-blue-ink)!important;      /* 浅底 → 必须深字，不跟 --g-ink */
  --sbk-shadow:rgba(74,163,255,.34)}
.sbk-on .opt:nth-child(5n+2),.sbk-on .optionsGrid button:nth-child(5n+2){
  background-color:var(--sbk-yellow-s)!important; border-color:var(--sbk-yellow)!important;
  color:var(--sbk-yellow-ink)!important;      /* 浅底 → 必须深字，不跟 --g-ink */
  --sbk-shadow:rgba(255,210,63,.42)}
.sbk-on .opt:nth-child(5n+3),.sbk-on .optionsGrid button:nth-child(5n+3){
  background-color:var(--sbk-green-s)!important; border-color:var(--sbk-green)!important;
  color:var(--sbk-green-ink)!important;      /* 浅底 → 必须深字，不跟 --g-ink */
  --sbk-shadow:rgba(94,194,106,.34)}
.sbk-on .opt:nth-child(5n+4),.sbk-on .optionsGrid button:nth-child(5n+4){
  background-color:var(--sbk-orange-s)!important; border-color:var(--sbk-orange)!important;
  color:var(--sbk-orange-ink)!important;      /* 浅底 → 必须深字，不跟 --g-ink */
  --sbk-shadow:rgba(255,159,69,.36)}
.sbk-on .opt:nth-child(5n+5),.sbk-on .optionsGrid button:nth-child(5n+5){
  background-color:var(--sbk-pink-s)!important; border-color:var(--sbk-pink)!important;
  color:var(--sbk-pink-ink)!important;      /* 浅底 → 必须深字，不跟 --g-ink */
  --sbk-shadow:rgba(255,143,177,.36)}

/* 按下：往下压 + 影子缩短（物理直觉：按下去了） */
.sbk-on .opt.sbk-press, .sbk-on .optionsGrid button.sbk-press{
  transform:translateY(4px) scale(.96) !important;
  box-shadow:0 1px 0 var(--sbk-shadow,rgba(0,0,0,.10)) !important;
  filter:saturate(1.15) brightness(1.03);
}
/* 选项生成的气泡：click 时的扩散圆环 */
.sbk-bubble{
  position:absolute; border-radius:50%; pointer-events:none;
  width:14px; height:14px; margin:-7px 0 0 -7px;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,255,255,.35) 55%,transparent 72%);
  animation:sbk-bub .52s ease-out forwards;
}
@keyframes sbk-bub{from{transform:scale(.4); opacity:.95} to{transform:scale(9); opacity:0}}

/* 正误态：只增强观感，不改类名（类名是判分信号，绝不能动） */
.sbk-on .opt.right, .sbk-on .opt.wrong{animation:none !important}   /* 让下面的 keyframes 接管 */
.sbk-on .opt.right, .sbk-on .opt.ok{
  background-color:var(--sbk-green-s)!important; border-color:var(--sbk-ok)!important;
  color:var(--sbk-ok-ink)!important;      /* 浅底深字，不跟 --g-ok */
}
.sbk-on .opt.wrong, .sbk-on .opt.no{
  background-color:var(--sbk-orange-s)!important; border-color:var(--sbk-bad)!important;
  color:var(--sbk-bad-ink)!important;      /* 浅底深字，不跟 --g-bad */
}
.sbk-on .fb.ok, .sbk-on #feedbackBar.ok{
  background-color:var(--sbk-green-s)!important; border-color:var(--sbk-ok)!important;
  color:var(--sbk-ok-ink)!important}
.sbk-on .fb.no, .sbk-on #feedbackBar.no{
  background-color:var(--sbk-yellow-s)!important; border-color:#e08b00!important;
  color:var(--sbk-warn-ink)!important}
/* 答对：弹跳 + 发光（只作用在正确项上，用 sbk-right 标记，不改原类名） */
.sbk-on .sbk-right{animation:sbk-pop .62s cubic-bezier(.34,1.56,.64,1) 2}
@keyframes sbk-pop{
  0%{transform:scale(1)} 22%{transform:scale(1.13)}
  44%{transform:scale(.97)} 66%{transform:scale(1.05)} 100%{transform:scale(1)}
}
.sbk-on .sbk-right::after{
  content:""; position:absolute; inset:-4px; border-radius:inherit; pointer-events:none;
  box-shadow:0 0 0 3px var(--sbk-ok), 0 0 26px 6px rgba(94,194,106,.55);
  animation:sbk-glow 1.1s ease-in-out 2;
}
@keyframes sbk-glow{0%,100%{opacity:.28}50%{opacity:1}}

/* 答错：温和横向抖动（幅度小、次数少，不吓到孩子） */
.sbk-on .sbk-wrong{animation:sbk-shake .5s cubic-bezier(.36,.07,.19,.97) 1}
@keyframes sbk-shake{
  0%,100%{transform:translateX(0)}
  18%{transform:translateX(-6px)} 38%{transform:translateX(6px)}
  58%{transform:translateX(-4px)} 78%{transform:translateX(3px)}
}

/* ---------- 题目进入动画：从下方弹上来 ----------
   ⚠️⚠️⚠️ 入场动画**绝对不要碰 opacity**（一次教训换来的）。
   原因：CSS 动画关键帧产生的值，优先级**高于**元素的普通 `opacity:1` 声明。
   所以只要 keyframes 里写了 `from{opacity:0}`，那个 0 就会赢过普通声明；
   而 `fill-mode:both/backwards` 在延迟期/结束后又会保持该帧的值 ——
   动画一旦没真正执行（引擎的 `@media (prefers-reduced-motion:reduce)`
   里 `*{animation:none!important}`、标签页被节流、动画时钟卡死），
   **整道题选项文字就永久消失**。一年级看不见选项 = 无法答题，是致命故障。

   第 1 版曾用「`opacity:1` 普通声明 + `fill-mode:backwards`」想兜底 ——
   **无效**，实测 31/33 个文件仍是 opacity:0（普通声明压不过关键帧）。

   现在改为**纯 transform 入场**：关键帧里只出现 transform（位移+缩放），
   opacity 完全不参与。这样无论动画跑不跑、跑多少帧，
   文字可见性都不受任何影响 —— 动画只是"位置观感增强"，而不是"可见性前提"。 */
.sbk-in{animation:sbk-in .52s cubic-bezier(.34,1.4,.64,1) backwards}
@keyframes sbk-in{
  from{transform:translateY(26px) scale(.94)}
  to{transform:none}
}
.sbk-in-opt{animation:sbk-in-opt .44s cubic-bezier(.34,1.5,.64,1) backwards}
@keyframes sbk-in-opt{
  from{transform:translateY(14px) scale(.92)}
  to{transform:none}
}

/* ---------- 答对奖励：星星 + 彩带 + 笑脸 + 点赞 ---------- */
.sbk-fx{position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden}
.sbk-star{position:absolute; font-size:30px; line-height:1;
  animation:sbk-star .95s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes sbk-star{
  0%{opacity:0; transform:translate(0,0) scale(.3) rotate(0)}
  18%{opacity:1; transform:translate(0,-16px) scale(1.25) rotate(18deg)}
  100%{opacity:0; transform:translate(var(--dx,40px),var(--dy,-150px)) scale(.55) rotate(220deg)}
}
.sbk-ribbon{position:absolute; width:11px; height:20px; border-radius:3px;
  animation:sbk-rib 1.05s ease-in forwards}
@keyframes sbk-rib{
  0%{opacity:0; transform:translate(0,0) rotate(0)}
  12%{opacity:1}
  100%{opacity:0; transform:translate(var(--dx,0),var(--dy,300px)) rotate(var(--rot,540deg))}
}
.sbk-cheer{position:fixed; left:50%; top:38%; z-index:61; pointer-events:none;
  transform:translate(-50%,-50%);
  animation:sbk-cheer 1.15s cubic-bezier(.34,1.5,.64,1) forwards}
.sbk-cheer .sbk-face{font-size:78px; line-height:1; animation:sbk-nod 1.15s ease-in-out}
.sbk-cheer .sbk-word{margin-top:4px; font-size:22px; font-weight:900; color:var(--sbk-ok-ink);
  text-shadow:0 2px 0 #fff, 0 0 16px rgba(94,194,106,.5); text-align:center}
@keyframes sbk-cheer{
  0%{opacity:0; transform:translate(-50%,-50%) scale(.3) rotate(-16deg)}
  30%{opacity:1; transform:translate(-50%,-50%) scale(1.1) rotate(6deg)}
  45%{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
  100%{opacity:0; transform:translate(-50%,-62%) scale(.96)}
}
@keyframes sbk-nod{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg) scale(1.06)}
  60%{transform:rotate(7deg) scale(1.03)}}
/* 答错：温和的提示气泡（从选项旁冒出来，不遮挡题目） */
.sbk-hint{position:fixed; z-index:61; pointer-events:none; transform:translate(-50%,-100%);
  background:var(--sbk-yellow-s); color:var(--sbk-warn-ink);
  border:2px solid var(--sbk-yellow); border-radius:16px;
  padding:8px 14px; font-size:16px; font-weight:800; white-space:nowrap;
  box-shadow:0 5px 0 rgba(0,0,0,.07);
  animation:sbk-hint 1.5s cubic-bezier(.34,1.4,.64,1) forwards}
@keyframes sbk-hint{
  0%{opacity:0; transform:translate(-50%,-84%) scale(.6)}
  16%{opacity:1; transform:translate(-50%,-100%) scale(1.06)}
  26%{transform:translate(-50%,-100%) scale(1)}
  80%{opacity:1; transform:translate(-50%,-100%) scale(1)}
  100%{opacity:0; transform:translate(-50%,-128%) scale(.9)}
}

/* ---------- 音效与音乐开关 ---------- */
.sbk-bar{position:fixed; right:10px; bottom:10px; z-index:70;

.sbk-ico{

  font-size:23px; line-height:1; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 0 rgba(0,0,0,.08); padding:0;
  transition:transform .14s cubic-bezier(.34,1.56,.64,1);
}
.sbk-ico:active{transform:translateY(3px) scale(.94)}
.sbk-ico:focus-visible{outline:3px solid var(--sbk-blue); outline-offset:2px}
.sbk-ico[aria-pressed="true"]{background:var(--sbk-blue-s); border-color:var(--sbk-blue)}
.sbk-ico.sbk-sound{position:relative}
.sbk-ico.sbk-off{opacity:.5; filter:grayscale(1)}

/* ---------- 结算页也放大 ---------- */
.sbk-on .done h2{font-size:30px !important}
.sbk-on .done .medal{font-size:84px !important;
  animation:sbk-bob 2.6s ease-in-out infinite; display:inline-block}
.sbk-on .btn, .sbk-on .resetBtn, .sbk-on #resetBtn{
  min-height:58px !important; border-radius:999px !important; font-size:20px !important;
  font-weight:900 !important; padding:14px 40px !important;
  background:var(--sbk-brand) !important; color:#fff !important;
  box-shadow:0 5px 0 rgba(0,0,0,.14) !important;
  transition:transform .14s cubic-bezier(.34,1.56,.64,1) !important;
}
.sbk-on .btn:active,.sbk-on #resetBtn:active{transform:translateY(4px) scale(.97) !important}

/* ---------- 三端适配：平板 / 手机 ---------- */
@media (max-width:760px){
  .sbk-on .q-title,.sbk-on #promptText{font-size:20px !important}
  .sbk-on .opt,.sbk-on .optionsGrid button{font-size:18px !important; min-height:60px !important}
  .sbk-on .stage .big{font-size:64px}
  .sbk-deco{opacity:.75}                 /* 小屏少一点装饰，避免抢注意力 */
}
@media (max-width:420px){
  .sbk-on .q-title,.sbk-on #promptText{font-size:19px !important}
  .sbk-on .opt,.sbk-on .optionsGrid button{
    min-height:60px !important; font-size:17px !important; border-radius:18px !important}
  .sbk-on .stage .big{font-size:54px}
  .sbk-on .stage .py{font-size:32px}
  .sbk-ico{width:48px; height:48px; font-size:21px}
  .sbk-bar{right:8px; bottom:8px}
}
/* 触屏：hover 会「粘住」，用 hover:hover 门控 */
@media (hover:none){
  .sbk-on .opt:active,.sbk-on .optionsGrid button:active{
    transform:translateY(4px) scale(.96) !important}
}
/* 无障碍：用户开了「减少动态效果」就全部关掉（游戏本体已有同类兜底） */
@media (prefers-reduced-motion:reduce){
  .sbk-deco{display:none !important}
  .sbk-in,.sbk-in-opt,.sbk-right,.sbk-wrong,.sbk-star,.sbk-ribbon,
  .sbk-cheer,.sbk-hint,.sbk-ba,.sbk-an,.sbk-st{animation:none !important}
  .sbk-in,.sbk-in-opt{opacity:1 !important; transform:none !important}
  /* 上面那条 opacity:1 现在只是双保险（keyframes 已不碰 opacity），
     真正让内容永不可见的原因已被「入场动画不碰 opacity」从根上除掉。 */
}
@media print{ .sbk-deco,.sbk-bar{display:none !important} }

<div class="game-container" id="gameContainer">

<script>
/* ============================================================
   游戏数据 —— 统编版一年级上册第一课《天地人》
   六个生字：天、地、人、你、我、他
   共 4 关，每关 4 题，共 16 题
   ============================================================ */

const LEVELS = [
  /* ---------- 第 1 关：看图猜字 ---------- */
  {
    name: "第 1 关 · 看图猜字",

          { char: "人", pinyin: "rén" },
          { char: "他", pinyin: "tā" }

        answer: "天",
        explain: "“天”就是头顶上高高的地方，蓝蓝的天空！"
      },
      {
        type: "picture",
        prompt: "这幅图画的是哪个汉字宝宝？",
        data: { emoji: "🌍🌱", label: "脚下踩着的土地" },
        options: [
          { char: "天", pinyin: "tiān" },
          { char: "地", pinyin: "dì" },
          { char: "我", pinyin: "wǒ" },
          { char: "你", pinyin: "nǐ" }
        ],
        answer: "地",
        explain: "“地”就是脚下踩着的土地，我们在上面走路、种花。"
      },
      {
        type: "picture",
        prompt: "这幅图画的是哪个汉字宝宝？",
        data: { emoji: "🧑", label: "站立着的人" },
        options: [
          { char: "人", pinyin: "rén" },
          { char: "天", pinyin: "tiān" },
          { char: "地", pinyin: "dì" },
          { char: "他", pinyin: "tā" }
        ],
        answer: "人",
        explain: "“人”字就像一个人侧身站立的样子，一撇一捺。"
      },
      {
        type: "picture",
        prompt: "这幅图画的是哪个汉字宝宝？",
        data: { emoji: "👧👦", label: "身边的同学和朋友" },
        options: [
          { char: "他", pinyin: "tā" },
          { char: "我", pinyin: "wǒ" },
          { char: "你", pinyin: "nǐ" },
          { char: "人", pinyin: "rén" }

        answer: "他",

  /* ---------- 第 2 关：听音选字 ---------- */
  {
    name: "第 2 关 · 听音选字",
    questions: [
      {
        type: "sound",
        prompt: "请选出听到的汉字",
        data: { hint: "读作“tiān”，第一声", icon: "🔊" },
        options: [
          { char: "天", pinyin: "tiān" },
          { char: "田", pinyin: "tián" },
          { char: "地", pinyin: "dì" },

        ],
        answer: "天",

      },
      {
        type: "sound",
        prompt: "请选出听到的汉字",
        data: { hint: "读作“dì”，第四声", icon: "🔊" },
        options: [
          { char: "地", pinyin: "dì" },
          { char: "弟", pinyin: "dì" },
          { char: "天", pinyin: "tiān" },
          { char: "他", pinyin: "tā" }
        ],
        answer: "地",
        explain: "“地”读 dì，第四声，就是土地的地。"
      },
      {
        type: "sound",
        prompt: "请选出听到的汉字",
        data: { hint: "读作“nǐ”，第三声", icon: "🔊" },
        options: [
          { char: "你", pinyin: "nǐ" },
          { char: "我", pinyin: "wǒ" },
          { char: "他", pinyin: "tā" },
          { char: "人", pinyin: "rén" }
        ],
        answer: "你",
        explain: "“你”读 nǐ，第三声，指对面的那个人。"
      },
      {
        type: "sound",
        prompt: "请选出听到的汉字",
        data: { hint: "读作“wǒ”，第三声", icon: "🔊" },
        options: [
          { char: "我", pinyin: "wǒ" },
          { char: "你", pinyin: "nǐ" },
          { char: "他", pinyin: "tā" },
          { char: "地", pinyin: "dì" }
        ],
        answer: "我",
        explain: "“我”读 wǒ，第三声，指自己。"

  /* ---------- 第 3 关：汉字演变动画 ---------- */
  {
    name: "第 3 关 · 汉字演变",
    questions: [
      {
        type: "evolution",
        prompt: "这个古文字正在变成哪个汉字？",
        data: { ancient: "𠆢", modern: "人", label: "古文字 → 现在" },

      {

        options: [
          { char: "天", pinyin: "tiān" },
          { char: "人", pinyin: "rén" },

      },
      {

      {

        data: { ancient: "亻", modern: "你", label: "古文字 → 现在" },
        options: [
          { char: "你", pinyin: "nǐ" },
          { char: "他", pinyin: "tā" },
          { char: "我", pinyin: "wǒ" },
          { char: "人", pinyin: "rén" }
        ],
        answer: "你",
        explain: "“你”左边是单人旁“亻”，右边是“尔”，表示对面的人。"
      }

  },

  /* ---------- 第 4 关：人称代词大挑战 ---------- */
  {
    name: "第 4 关 · 人称代词大挑战",
    questions: [
      {
        type: "sentence",
        prompt: "这句话的横线上应该填哪个字？",

/* ============================================================
   游戏状态
   ============================================================ */

let currentLevel = 0;
let currentQuestion = 0;
let score = 0;
let mistakes = 0;
let totalQuestions = LEVELS.reduce((sum, lv) => sum + lv.questions.length, 0);
let locked = false;
let questionAnswered = false;

const levelBadge     = document.getElementById("levelBadge");
const scoreText      = document.getElementById("scoreText");
const progressFill   = document.getElementById("progressFill");
const promptText     = document.getElementById("promptText");
const visualArea     = document.getElementById("visualArea");
const optionsGrid    = document.getElementById("optionsGrid");
const feedbackBar    = document.getElementById("feedbackBar");
const resultPanel    = document.getElementById("resultPanel");
const medalEmoji     = document.getElementById("medalEmoji");
const resultTitle    = document.getElementById("resultTitle");
const finalScoreText = document.getElementById("finalScoreText");

/* ============================================================
   渲染题目
   ============================================================ */

function renderQuestion() {
  const level = LEVELS[currentLevel];
  const q = level.questions[currentQuestion];

  levelBadge.textContent = level.name;
  scoreText.textContent = score + " / " + totalQuestions;
  progressFill.style.width = (score / totalQuestions * 100) + "%";

  promptText.textContent = q.prompt;
  visualArea.innerHTML = renderVisual(q);

  feedbackBar.textContent = "";
  feedbackBar.className = "feedback-bar";

  optionsGrid.innerHTML = "";
  const shuffled = shuffleArray([...q.options]);
  shuffled.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = opt.char + `<span class="opt-pinyin">${opt.pinyin}</span>`;
    btn.addEventListener("click", () => handleOptionClick(btn, opt.char, q));
    optionsGrid.appendChild(btn);
  });

  locked = false;
  questionAnswered = false;
}

/* ============================================================
   视觉渲染分发
   ============================================================ */

function renderVisual(q) {
  switch (q.type) {
    case "picture":   return renderPicture(q.data);
    case "sound":     return renderSound(q.data);
    case "evolution": return renderEvolution(q.data);
    case "sentence":  return renderSentence(q.data);
    default:          return "";
  }
}

/* ---------- 看图猜字 ---------- */
function renderPicture(data) {
  return `
    <div class="picture-card">
      <span class="picture-emoji">${data.emoji}</span>
      <span class="picture-label">${data.label}</span>
    </div>
  `;
}

/* ---------- 听音选字（文字模拟） ---------- */
function renderSound(data) {
  return `
    <div class="sound-card">
      <span class="sound-icon">${data.icon}</span>
      <span class="sound-hint">${data.hint}</span>
    </div>
  `;
}

/* ---------- 汉字演变 ---------- */
function renderEvolution(data) {
  return `
    <div class="evolution-stage">
      <div class="evo-step">
        <div class="evo-glyph ancient">${data.ancient}</div>
        <div class="evo-label">古文字</div>
      </div>
      <div class="evo-arrow">→</div>
      <div class="evo-step">
        <div class="evo-glyph modern">${data.modern}</div>
        <div class="evo-label">现在</div>
      </div>
    </div>
  `;
}

/* ---------- 人称代词句子 ---------- */
function renderSentence(data) {
  return `
    <div class="sentence-card">
      <div class="sentence-text">
        ${data.before}<span class="sentence-blank">？</span>${data.after}
      </div>
      <div style="font-size:13px;color:#95a5a6;margin-top:8px;">💡 ${data.hint}</div>
    </div>
  `;
}

/* ============================================================
   选项点击处理
   ============================================================ */

function handleOptionClick(btn, optChar, q) {
  if (locked || questionAnswered) return;

  if (optChar === q.answer) {
    questionAnswered = true;
    locked = true;

    btn.classList.add("correct");
    document.querySelectorAll(".option-btn").forEach(b => {
      if (b !== btn) b.classList.add("dimmed");
    });

    score++;
    scoreText.textContent = score + " / " + totalQuestions;
    progressFill.style.width = (score / totalQuestions * 100) + "%";

    spawnStars(btn);

    const praise = pickRandom(["太棒啦！🎉", "答对了！⭐", "真聪明！🌟", "你真厉害！👏", "完全正确！✨"]);
    feedbackBar.textContent = praise + " " + q.explain;
    feedbackBar.className = "feedback-bar good";

    setTimeout(advanceQuestion, 1500);
  } else {
    mistakes++;
    btn.classList.add("wrong");
    btn.disabled = true;
    feedbackBar.textContent = "再想一想哦～ 🤔";
    feedbackBar.className = "feedback-bar bad";

    setTimeout(() => {
      btn.classList.remove("wrong");
      btn.disabled = false;
    }, 700);
  }
}

/* ============================================================
   推进流程
   ============================================================ */

function advanceQuestion() {
  currentQuestion++;

  if (currentQuestion < LEVELS[currentLevel].questions.length) {
    renderQuestion();
  } else {
    currentLevel++;
    currentQuestion = 0;

    if (currentLevel < LEVELS.length) {
      showLevelTransition();
    } else {
      showResult();
    }
  }
}

function showLevelTransition() {
  promptText.textContent = "";
  visualArea.innerHTML = `<div class="level-transition">🎉 进入<br>${LEVELS[currentLevel].name}</div>`;
  optionsGrid.innerHTML = "";
  feedbackBar.textContent = "准备好了吗？";
  feedbackBar.className = "feedback-bar good";

  setTimeout(renderQuestion, 1300);
}

/* ============================================================
   结算
   ============================================================ */

function showResult() {
  promptText.style.display = "none";
  visualArea.style.display = "none";
  optionsGrid.style.display = "none";
  feedbackBar.style.display = "none";
  resultPanel.style.display = "block";

  scoreText.textContent = score + " / " + totalQuestions;
  progressFill.style.width = "100%";
  levelBadge.textContent = "🎉 通关啦！";

  let medal = "🏅", title = "完成挑战！";
  if (mistakes === 0) {
    medal = "🏆";
    title = "完美通关！你是汉字小达人！";
  } else if (mistakes <= 3) {
    medal = "🥇";
    title = "非常棒！只错了 " + mistakes + " 次。";
  } else if (mistakes <= 6) {
    medal = "🥈";
    title = "做得不错！错了 " + mistakes + " 次，继续加油！";
  } else {
    medal = "🥉";
    title = "完成啦！错了 " + mistakes + " 次，多练习会更棒！";
  }

  medalEmoji.textContent = medal;
  resultTitle.textContent = title;
  finalScoreText.textContent = "共 " + totalQuestions + " 题，答对 " + score + " 题";
}

/* ============================================================
   重新开始
   ============================================================ */

function restartGame() {
  currentLevel = 0;
  currentQuestion = 0;
  score = 0;
  mistakes = 0;
  locked = false;
  questionAnswered = false;

  promptText.style.display = "";
  visualArea.style.display = "";
  optionsGrid.style.display = "";
  feedbackBar.style.display = "";
  resultPanel.style.display = "none";

  renderQuestion();
}

/* ============================================================
   工具函数
   ============================================================ */

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function spawnStars(originEl) {
  const rect = originEl.getBoundingClientRect();
  const emojis = ["⭐", "🌟", "✨", "💫"];

  for (let i = 0; i < 6; i++) {
    const s = document.createElement("span");
    s.className = "star-fall";
    s.textContent = pickRandom(emojis);
    s.style.left = (rect.left + rect.width / 2 + (Math.random() - 0.5) * 100) + "px";
    s.style.top  = (rect.top + rect.height / 3) + "px";
    s.style.animationDelay = (i * 0.06) + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}

/* ============================================================
   启动
   ============================================================ */

renderQuestion();
</script>
<script>
/* __SBK_JS__ */
/* ============================================================
   sb-kids 一年级游戏增强层（音效 / 动效 / 背景装饰）
   ------------------------------------------------------------
   ⚠ 本段**不修改任何判分逻辑**，只「观察」：
     · 选项点击：捕获阶段监听 click，只播音效 + 加按压类，**不 preventDefault、
       不 stopPropagation**，引擎的 choose() 照常执行。
     · 正误判定：MutationObserver 盯 #fb / .fb / #feedbackBar 的 class，
       识别出 ok / no 后播对应音效与奖励 / 提示动画。
     · 题目切换：盯 #title / #stage / #opts 的 childList 变化，播进入动画 + 提示音。
   引擎将来重写也不影响本层（它只认 DOM 约定）。
   ============================================================ */
(function () {
  "use strict";
  if (document.documentElement.getAttribute("data-sbk") === "1") { return; }  // 幂等
  document.documentElement.setAttribute("data-sbk", "1");

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------------------------------------------------
     1. Web Audio：全部音效现场合成，零文件依赖
     --------------------------------------------------------- */
  var AC = window.AudioContext || window.webkitAudioContext;
  var ac = null, master = null;
  var sndOn = true, bgmOn = false;      /* 音效默认开；BGM 默认关（有声环境下不擅自播） */
  var BGM_KEY = "sbk_sound";
  /* ⚠️⚠️ 浏览器自动播放策略：用户产生任何交互手势（pointerdown/click/keydown）之前，
     **绝对不能 new AudioContext()**，否则 Chrome 会在控制台反复报
     "The AudioContext was not allowed to start" 警告，且声音也不会响。
     所以这里用一个「已解锁」闸门：闸门未开时 audio() 直接返回 null，
     所有 play/bgm 都自然空转，不产生任何报错。 */
  var unlocked = false;

  function audio() {
    if (!AC || !unlocked) { return null; }
    if (!ac) {
      try {
        ac = new AC();
        master = ac.createGain();
        master.gain.value = 0.5;
        master.connect(ac.destination);
      } catch (e) { ac = null; }
    }
    /* 闸门已开但上下文仍可能被暂停（如切到后台标签页回来），补一次 resume */
    if (ac && ac.state === "suspended") { try { ac.resume(); } catch (e) {} }
    return ac;
  }
  /* 首次用户手势时调用：开闸 + 恢复上下文 + 按需起 BGM */
  function unlockAudio() {
    if (unlocked) { return; }
    unlocked = true;
    var a = audio();
    if (a) { try { a.resume(); } catch (e) {} }
    if (bgmOn) { bgmStart(); }
  }
  function env(node, t0, a, d, peak) {
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    node.connect(g); g.connect(master);
    return g;
  }
  function tone(freq, t0, dur, type, peak) {
    var o = ac.createOscillator();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    env(o, t0, Math.min(0.02, dur * 0.25), dur, peak == null ? 0.3 : peak);
    o.start(t0); o.stop(t0 + dur + 0.06);
    return o;
  }
  /* 频率滑音（滑音本身就有"跳起来"的听感，比纯 beep 更活泼） */
  function slide(f0, f1, t0, dur, type, peak) {
    var o = ac.createOscillator();
    o.type = type || "triangle";
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    env(o, t0, 0.012, dur, peak == null ? 0.26 : peak);
    o.start(t0); o.stop(t0 + dur + 0.06);
  }

  /* —— 五种音效 —— */
  var SFX = {
    /* 点击：短促清脆的「叮」，音高偏高（一年级对高频更敏感） */
    click: function (t) { tone(1180, t, 0.055, "sine", 0.16); tone(1760, t + 0.012, 0.05, "sine", 0.09); },
    /* 答对：C-E-G-C 上行大跳 + 高音，标准"答对"感 */
    right: function (t) {
      tone(523.25, t, 0.12, "triangle", 0.26);
      tone(659.25, t + 0.09, 0.12, "triangle", 0.26);
      tone(783.99, t + 0.18, 0.12, "triangle", 0.26);
      tone(1046.5, t + 0.27, 0.34, "sine", 0.3);

    /* 答错：柔和的下行小三度，绝不用刺耳的蜂鸣（吓到孩子） */
    wrong: function (t) {
      tone(392, t, 0.14, "sine", 0.2);
      tone(311.13, t + 0.11, 0.24, "sine", 0.18);
    },
    /* 题目开始：两声上行邀请音 */
    start: function (t) { tone(659.25, t, 0.1, "sine", 0.2); tone(880, t + 0.1, 0.16, "sine", 0.22); },
    /* 结算：一串小乐句 */
    finish: function (t) {
      var f = [523.25, 659.25, 783.99, 1046.5];

  var bgmTimer = null, bgmStep = 0;

    /* C 大调五声音阶拨弦，节奏轻快不吵 */
    [523.25, 659.25, 783.99, 1046.5, 783.99, 659.25, 587.33, 0],
    [523.25, 659.25, 783.99, 1046.5, 880, 783.99, 659.25, 0]

  function bgmTick() {

      var row = BGM_SEQ[bgmStep % BGM_SEQ.length];
      for (var i = 0; i < row.length; i++) {
        if (!row[i]) { continue; }
        var t = a.currentTime + i * 0.19;
        var o = a.createOscillator();
        o.type = "triangle";
        o.frequency.setValueAtTime(row[i], t);

  }
  function bgmStart() {
    if (bgmTimer) { return; }

    if (!unlocked) { return; }

  function loadPref() {

  /* ---------------------------------------------------------
     2. 卡通背景装饰层

  function deco() {

      html.push('<span class="sbk-cl" style="top:' + top + 'vh;width:0;height:0;'

    for (var s = 0; s < stars.length; s++) {
      var L = 5 + (s * 13) % 88, T = 5 + (s * 19) % 78;
      html.push('<span class="sbk-st ' + (s % 3 === 0 ? "" : "s" + (s % 3 === 0 ? 2 : s % 3)) + '"'
        + ' style="left:' + L + '%;top:' + T + 'vh;'
        + 'animation:sbk-tw ' + (2.4 + s * 0.42) + 's ease-in-out infinite;'
        + 'animation-delay:-' + (s * 0.63) + 's">' + stars[s] + "</span>");
    }

    html.push('<span class="sbk-rb" style="right:3%;bottom:19vh"></span>');
    /* 气球：底部两侧，上下浮动 */
    var bal = ["🎈", "🎈", "🎈", "🎈"];
    for (var bI = 0; bI < bal.length; bI++) {
      var bl = 4 + bI * 27, bd = 6.4 + bI * 1.3;
      html.push('<span class="sbk-ba" style="left:' + bl + '%;bottom:6vh;'
        + 'animation:sbk-float ' + bd + 's ease-in-out infinite;animation-delay:-' + (bI * 1.4) + 's">'
        + bal[bI] + "</span>");
    }

    var an = ["🐰", "🐻", "🐱", "🏫", "🌳", "🐥"];
    for (var aI = 0; aI < an.length; aI++) {
      var al = 2 + aI * 16.5;
      html.push('<span class="sbk-an" style="left:' + al + '%;bottom:1.5vh;'
        + 'animation:sbk-bob ' + (3.6 + aI * 0.5) + 's ease-in-out infinite;'
        + 'animation-delay:-' + (aI * 0.8) + 's">' + an[aI] + "</span>");
    }

    document.body.appendChild(box);
  }

  /* ---------------------------------------------------------
     3. 特效：星星 / 彩带 / 笑脸 / 温和提示气泡
     --------------------------------------------------------- */
  function fx() {
    if (reduced) { return null; }

    b.className = "sbk-fx";
    b.setAttribute("aria-hidden", "true");

  }
  function burstRight(host) {

    var R = host ? host.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };

        rb.style.top = (R.top + R.height / 2) + "px";

        rb.style.setProperty("--dy", (180 + Math.random() * 200) + "px");
        rb.style.setProperty("--rot", (Math.random() * 900 - 450) + "deg");
        rb.style.animationDelay = (Math.random() * 0.16) + "s";
        box.appendChild(rb);

      for (var k = 0; k < 14; k++) {
        var st = document.createElement("span");
        st.className = "sbk-star";
        st.textContent = k % 3 === 0 ? "🌟" : (k % 3 === 1 ? "⭐" : "✨");
        st.style.left = (R.left + R.width / 2) + "px";
        st.style.top = (R.top + R.height / 2) + "px";
        st.style.setProperty("--dx", (Math.random() * 320 - 160) + "px");
        st.style.setProperty("--dy", -(90 + Math.random() * 200) + "px");
        st.style.animationDelay = (Math.random() * 0.22) + "s";
        st.style.fontSize = (20 + Math.random() * 16) + "px";
        box.appendChild(st);
      }
      setTimeout(function () { if (box.parentNode) { box.parentNode.removeChild(box); } }, 1900);
    }
    /* 笑脸 + 点赞：屏幕中央的独立层（不吃掉上面的事件） */
    var c = document.createElement("div");
    c.className = "sbk-cheer";
    c.setAttribute("aria-hidden", "true");
    var faces = ["😄", "🎉", "👏", "😃", "🌟"];
    var words = ["答对啦！", "太棒了！", "真厉害！", "好样的！", "满分哦！"];
    var idx = Math.floor(Math.random() * faces.length);
    c.innerHTML = '<div class="sbk-face">' + faces[idx] + "</div>"
                + '<div class="sbk-word">' + words[idx] + "</div>";
    document.body.appendChild(c);
    setTimeout(function () { if (c.parentNode) { c.parentNode.removeChild(c); } }, 1300);
  }
  function hintWrong(host) {
    if (reduced || !host) { return; }
    var r = host.getBoundingClientRect();
    var h = document.createElement("div");
    h.className = "sbk-hint";
    h.setAttribute("aria-hidden", "true");
    h.textContent = ["再想一想～", "差一点点！", "看看题目哦", "不着急，再试试"][Math.floor(Math.random() * 4)];
    h.style.left = Math.max(80, Math.min(innerWidth - 80, r.left + r.width / 2)) + "px";
    h.style.top = Math.max(70, r.top - 6) + "px";
    document.body.appendChild(h);
    setTimeout(function () { if (h.parentNode) { h.parentNode.removeChild(h); } }, 1650);
  }

  /* ---------------------------------------------------------
     4. 题目进入动画 + 开始提示音
     --------------------------------------------------------- */
  var seenQ = "";                 /* 记住当前题干，避免同一题反复播提示音 */
  function animIn(node, cls, delay) {
    if (!node || reduced) { return; }
    /* 防御：若环境把 CSS 动画整体禁掉（引擎在 prefers-reduced-motion 下
       会写 `*{animation:none !important}`），就不要加动画 class。 */
    if (!canAnimate()) { return; }
    node.classList.remove(cls);
    /* 强制 reflow 让动画能重放（同 class 连续加不会重新触发动画） */
    void node.offsetWidth;
    node.style.animationDelay = (delay || 0) + "s";
    node.classList.add(cls);
    /* ⚠️ 保险丝：动画若因任何原因没能推进（标签页被节流、渲染中断、
       动画时钟卡死等），元素会永远停在 from 帧的位移/缩放上 ——
       虽然不再影响文字可见性（keyframes 已不碰 opacity），
       但选项会一直偏在下方并缩小，看着像没加载出来。
       这里超时后直接把 class 摘掉，回到自然位置。 */
    clearTimeout(node._sbkFuse);
    node._sbkFuse = setTimeout(function () {
      if (!node.classList.contains(cls)) { return; }
      var list = node.getAnimations ? node.getAnimations() : [];
      var stuck = true;
      for (var i = 0; i < list.length; i++) {
        /* playState 仍是 running 说明没播完（可能只是还在正常播）；
           真正卡死的是 currentTime 一点没推进。用后者判定。 */
        if ((list[i].currentTime || 0) > 0) { stuck = false; break; }
      }
      if (stuck) { node.classList.remove(cls); }
    }, 1500);
  }
  var _canAnimate = null;
  /* ⚠️ 探测必须用**真实存在**的 @keyframes 名（如 sbk-in-opt）。
     用不存在的名字（如 sbk-nonexistent-probe）浏览器不会创建动画实例，
     getAnimations() 恒为空 → canAnimate 恒 false → 真实浏览器里动画被全部误杀。
     再把动画冻结在起始帧，确认 from 帧的 transform 真的生效
     （keyframes 现在只动 transform，不动 opacity）。 */
  function canAnimate() {
    if (_canAnimate !== null) { return _canAnimate; }
    var probe = document.createElement("div");
    probe.style.cssText = "position:absolute;left:-9999px;top:0;width:1px;height:1px;pointer-events:none";
    probe.className = "sbk-in-opt";
    document.body.appendChild(probe);
    var running = false;
    try {
      var list = probe.getAnimations ? probe.getAnimations() : [];
      running = list.length > 0;
      if (running && list[0]) {
        list[0].pause();
        list[0].currentTime = 0;
        var tf = getComputedStyle(probe).transform;
        /* from 帧是 translateY(14px) scale(.92)，矩阵不应是单位矩阵 */
        running = !!tf && tf !== "none" && tf.indexOf("matrix") === 0;
      }
    } catch (e) { running = false; }
    if (probe.parentNode) { probe.parentNode.removeChild(probe); }
    _canAnimate = running;
    return running;
  }
  function questionIn() {
    var q = document.getElementById("q") || document.getElementById("gameContainer")
         || document.querySelector(".q") || document.querySelector(".wrap");
    animIn(q, "sbk-in", 0);
    var opts = document.querySelectorAll("#opts .opt, .optionsGrid button, .opt");
    for (var i = 0; i < opts.length; i++) { animIn(opts[i], "sbk-in-opt", 0.06 + i * 0.07); }
  }
  function maybeStartTone() {
    var t = document.getElementById("title") || document.getElementById("promptText");
    var key = t ? (t.textContent || "").trim() : "";
    if (!key) { return; }
    if (key !== seenQ) { seenQ = key; play("start"); }
  }

  /* ---------------------------------------------------------
     5. 挂钩：全部在「观察」，不干预判分
     --------------------------------------------------------- */
  function isOpt(b) {
    if (!b || b.nodeType !== 1) { return false; }
    if (b.classList && (b.classList.contains("opt") || b.classList.contains("optbtn"))) { return true; }
    var p = b.closest ? b.closest(".opt,.optbtn") : null;
    if (p) { return true; }
    /* optionsGrid 这类异类结构：按钮且在选项容器里 */
    var og = b.closest ? b.closest("#optionsGrid,.optionsGrid,.opts") : null;
    return !!(og && og.tagName !== "BODY" && b.tagName === "BUTTON");
  }
  function bubble(b) {
    if (reduced || !b) { return; }
    var r = b.getBoundingClientRect();
    var e = document.createElement("span");
    e.className = "sbk-bubble";
    e.style.left = (r.left + r.width / 2) + "px";
    e.style.top = (r.top + r.height / 2) + "px";
    document.body.appendChild(e);
    setTimeout(function () { if (e.parentNode) { e.parentNode.removeChild(e); } }, 560);
  }

  /* 5a. 选项点击：捕获阶段，只加动效与音效，不阻断引擎 */
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    /* ⚠️ 必须在 play() 之前开闸：本监听是**捕获阶段**，比 boot() 里挂在
       冒泡阶段的 unlockAudio 先跑。若不在这里解锁，孩子第一次点选项就听不到
       点击音（闸门还没开）。unlockAudio 内部有幂等守卫，重复调用无副作用。 */
    unlockAudio();
    /* 音效/音乐开关自己不播点击音（否则会自我循环） */
    if (t && t.closest && t.closest(".sbk-bar")) { return; }
    if (!isOpt(t)) { return; }
    var b = t.closest ? (t.closest(".opt,.optbtn") || t) : t;
    play("click");
    bubble(b);
    b.classList.add("sbk-press");
    setTimeout(function () { b.classList.remove("sbk-press"); }, 180);
  }, true);
  /* pointerdown 也要有按压感：click 在触摸端有 300ms 延迟，
     立刻按压更跟手。仍然只改 class，不阻止任何事。 */
  document.addEventListener("pointerdown", function (ev) {
    unlockAudio();
    if (reduced || !isOpt(ev.target)) { return; }
    var b = ev.target.closest ? (ev.target.closest(".opt,.optbtn") || ev.target) : ev.target;
    if (b && b.classList) { b.classList.add("sbk-press"); }
  }, true);

  /* 5b. 正误反馈：盯 class 变化，识别 ok / no */
  var lastFb = "";
  function feedback() {
    var fb = document.getElementById("fb") || document.querySelector(".fb")
          || document.getElementById("feedbackBar") || document.querySelector("#feedbackBar,.feedback");
    if (!fb) { return; }
    var cl = fb.className || "";
    var ok = /(^|\s)(ok|right|correct)(\s|$)/.test(cl);
    var no = /(^|\s)(no|wrong|bad)(\s|$)/.test(cl);
    var st = ok ? "ok" : (no ? "no" : "");
    if (!st || st === lastFb) { return; }
    lastFb = st;
    if (st === "ok") {
      play("right");
      var good = document.querySelector(".opt.right,.opt.ok,#optionsGrid .right,#optionsGrid .ok")
              || document.querySelector(".opt:not(.dim)");
      if (good) {
        good.classList.remove("sbk-right");
        void good.offsetWidth;
        good.classList.add("sbk-right");
        setTimeout(function () { good.classList.remove("sbk-right"); }, 1500);
      }
      burstRight(good);
    } else {
      play("wrong");
      var bad = document.querySelector(".opt.wrong,.opt.no,#optionsGrid .wrong,#optionsGrid .no");
      if (bad) {
        bad.classList.remove("sbk-wrong");
        void bad.offsetWidth;
        bad.classList.add("sbk-wrong");
        setTimeout(function () { bad.classList.remove("sbk-wrong"); }, 700);
        hintWrong(bad);
      }
    }
  }

  /* 5c. 题目切换：选项容器内容变化 = 换题了 */
  function watchQuestion() {
    var opts = document.getElementById("opts") || document.querySelector(".opts")
            || document.getElementById("optionsGrid") || document.querySelector(".optionsGrid");
    if (opts && window.MutationObserver) {
      new MutationObserver(function () {
        /* 延一帧：等 innerHTML 全部替换完 */
        setTimeout(function () { questionIn(); maybeStartTone(); }, 30);
      }).observe(opts, { childList: true, subtree: true });
    }
    var t = document.getElementById("title") || document.getElementById("promptText");
    if (t && window.MutationObserver) {
      new MutationObserver(function () { setTimeout(questionIn, 20); })
        .observe(t, { childList: true, characterData: true, subtree: true });
    }
    if (document.body && window.MutationObserver) {
      new MutationObserver(function () { setTimeout(feedback, 20); })
        .observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class"] });
    }
  }

  /* ---------------------------------------------------------
     6. 音效 / 音乐开关（浮动两个圆钮）
     --------------------------------------------------------- */
  function switchBar() {
    var bar = document.createElement("div");
    bar.className = "sbk-bar";
    var snd = document.createElement("button");
    snd.type = "button"; snd.className = "sbk-ico sbk-sound";
    snd.title = "音效开关";
    snd.setAttribute("aria-label", "音效开关");
    snd.setAttribute("aria-pressed", sndOn ? "true" : "false");
    var bgm = document.createElement("button");
    bgm.type = "button"; bgm.className = "sbk-ico";
    bgm.title = "背景音乐开关";
    bgm.setAttribute("aria-label", "背景音乐开关");
    bgm.setAttribute("aria-pressed", bgmOn ? "true" : "false");
    function paint() {
      snd.textContent = sndOn ? "🔊" : "🔇";
      snd.classList.toggle("sbk-off", !sndOn);
      snd.setAttribute("aria-pressed", sndOn ? "true" : "false");
      bgm.textContent = bgmOn ? "🎵" : "🎶";
      bgm.classList.toggle("sbk-off", !bgmOn);
      bgm.setAttribute("aria-pressed", bgmOn ? "true" : "false");
    }
    snd.addEventListener("click", function (e) {
      e.stopPropagation();
      unlockAudio();                     /* 开关本身也是用户手势，要能立刻出声 */
      sndOn = !sndOn;
      if (!sndOn) { bgmStop(); }         /* 关音效必然连带停 BGM，否则静音播放更怪 */
      else { var a = audio(); if (a) { try { SFX.click(a.currentTime + 0.01); } catch (er) {} } }
      savePref(); paint();
    });
    bgm.addEventListener("click", function (e) {
      e.stopPropagation();
      unlockAudio();
      bgmOn = !bgmOn;
      if (bgmOn) { bgmStart(); var a = audio();
        if (a) { try { SFX.start(a.currentTime + 0.01); } catch (er) {} } }
      else { bgmStop(); }
      savePref(); paint();
    });
    bar.appendChild(snd); bar.appendChild(bgm);
    document.body.appendChild(bar);
    paint();
  }

  /* ---------------------------------------------------------
     7. 启动
     --------------------------------------------------------- */
  function boot() {
    loadPref();
    deco();
    switchBar();
    watchQuestion();
    questionIn();
    setTimeout(maybeStartTone, 260);
    /* ⚠️ 音频解锁闸门：必须挂在**真实用户手势**上。
       之前用 setTimeout(maybeStartTone) 在页面加载后就 play("start")，
       此时还没有任何手势 → 浏览器拒绝启动 AudioContext，控制台刷出一串
       "The AudioContext was not allowed to start" 警告。
       现在 audio() 内部有 unlocked 闸门，加载期所有发声都空转且不报错；
       这里在首次手势时开闸。keydown/touchstart 一并挂上，兼顾键盘与旧触屏。 */
    ["pointerdown", "click", "keydown", "touchstart"].forEach(function (ev) {
      document.addEventListener(ev, unlockAudio, { passive: true });
    });
    /* 结算页：把「再玩一次 / 重来」换成本层配色（它们的类名各游戏不同，
       用语义类兜底，见 CSS 里的 .btn / .resetBtn / #resetBtn） */
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }
})();
</script>
</body>
</html>
